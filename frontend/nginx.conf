# Portail : SPA seule. Les API (/api/v1/planning, /api/v1/core) et Keycloak sont
# routés par la passerelle commune cfao-edge, pas ici.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    # SAMEORIGIN : les PDF des catalogues s'ouvrent dans une iframe du portail.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Configuration du déploiement, écrite au démarrage dans /tmp (lecture seule ailleurs).
    location = /config.js {
        alias /tmp/portail-config.js;
        expires -1;
    }

    # Jamais en cache : point d'entrée, garde de démarrage, annonce de maintenance.
    location ~ ^/(index\.html|boot-guard\.js|maintenance\.json)$ {
        expires -1;
    }

    # Fichiers de Vite (nom haché) : cache long. Les photos de public/assets n'ont
    # pas de hachage : cache court.
    location /assets/ {
        location ~ "-[A-Za-z0-9_-]{8}\.(js|css)$" {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
