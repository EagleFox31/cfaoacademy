# BFF — oauth2-proxy ↔ Keycloak (client confidentiel cfao-portal, provisionné par 00-6).
# Service `oauth2-proxy` du docker-compose.yml, point d'entrée de la plateforme (port 8000) :
#   1) cp .env.example .env  et  OAUTH2_PROXY_COOKIE_SECRET=$(openssl rand -base64 32 | head -c 32)
#   2) docker compose up
# La SPA passe par ce proxy : flow OIDC géré ici, cookie de session httpOnly côté navigateur,
# Bearer réinjecté vers les APIs (la SPA ne voit jamais le JWT). Voir architecture_complement.md §5.
# Secrets : OAUTH2_PROXY_CLIENT_SECRET et OAUTH2_PROXY_COOKIE_SECRET, lus dans l'environnement.

provider = "oidc"
client_id = "cfao-portal"
email_domains = ["*"]
redirect_url = "http://localhost:8000/oauth2/callback"
skip_provider_button = true

# Keycloak est joint sous deux noms : `localhost:8080` par le navigateur (connexion),
# `keycloak:8080` par les conteneurs (échange du code, clés). Découverte désactivée,
# adresses explicites. DEV uniquement pour la vérification d'émetteur : en production,
# un seul nom public (TLS) et ce réglage disparaît.
skip_oidc_discovery = true
oidc_issuer_url = "http://keycloak:8080/realms/cfao"
login_url = "http://localhost:8080/realms/cfao/protocol/openid-connect/auth"
redeem_url = "http://keycloak:8080/realms/cfao/protocol/openid-connect/token"
oidc_jwks_url = "http://keycloak:8080/realms/cfao/protocol/openid-connect/certs"
insecure_oidc_skip_issuer_verification = true

# Sessions : cookie httpOnly côté navigateur ; le proxy détient le token.
cookie_httponly = true
cookie_secure = false           # true derrière TLS en prod
cookie_samesite = "lax"
session_store_type = "cookie"

# Retour après connexion : la SPA de dev (Vite) est servie sur un autre port.
whitelist_domains = ["localhost:5173", "localhost:5174"]

# Les appels d'API sans session reçoivent 401 (et non une page de connexion) :
# la SPA redirige alors elle-même vers /oauth2/start.
api_routes = ["^/api/", "^/apercu/"]

# Sonde de vie publique.
skip_auth_routes = ["^/healthz$"]

# Réinjection du Bearer vers les upstreams (les services valident le JWT via JWKS).
pass_access_token = true
pass_authorization_header = true
set_authorization_header = true
skip_jwt_bearer_tokens = true

# Upstream protégé : le gateway (qui route /api/v1/core, /api/v1/ops et /apercu).
http_address = "0.0.0.0:4180"
upstreams = ["http://gateway:80/"]
reverse_proxy = true
