# Gateway — reverse proxy. Route /api/v1/core → Django, /api/v1/ops → Node.
# Le BFF (oauth2-proxy) s'insère ici une fois le client Keycloak provisionné :
# auth_request vers /oauth2/auth, puis injection du Bearer vers les services.
upstream core { server core:8000; }
upstream operations { server operations:3000; }
upstream rapports { server rapports:5175; }

server {
  listen 80;
  server_name _;

  # En-têtes de sécurité de base (durcir avant prod : CSP stricte, etc.).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/v1/core/ {
    proxy_pass http://core/api/v1/core/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/ops/ {
    proxy_pass http://operations/api/v1/ops/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Rapports formateur (04-5) : la session du portail (/cr-donnees). Le portail
  # n'appelle plus /apercu : l'interface du module l'atteint par sa propre passerelle.
  # Photos envoyees en entier, rapport complet long a produire.
  location ~ ^/cr-donnees/ {
    proxy_pass http://rapports;
    proxy_set_header X-User-ID "";
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
}
