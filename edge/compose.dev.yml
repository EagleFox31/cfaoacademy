# Pile de recette locale derrière cfao-edge, même chemin qu'en production :
#   http://localhost:8088/                  -> front du portail (vite, frontend/compose.dev.yml)
#   http://localhost:8088/auth/             -> Keycloak commun, image de prod (servi sous /auth)
#   http://localhost:8088/api/v1/planning/  -> API planning (cfao-planning/docker-compose.yml)
# Autorisation : PDP Cerbos unique du compose racine (service `cerbos`).
#
# Ordre de lancement (depuis la racine du dépôt) :
#   RAPPORTS_SECRET_KEY=x docker compose up -d cerbos
#   docker compose -f edge/compose.dev.yml up -d --build
#   VITE_OIDC_ISSUER=http://localhost:8088/auth/realms/cfao \
#     docker compose -f frontend/compose.dev.yml up -d
#   OIDC_AUDIENCE=cfao-planning-api OIDC_TRUSTED_ISSUERS="http://localhost:8088/auth/realms/cfao=http://host.docker.internal:8088/auth/realms/cfao/protocol/openid-connect/certs" \
#     docker compose -f cfao-planning/docker-compose.yml up -d
#
# Comptes de démo (keycloak/config/dev, mot de passe `demo`) : jamais en prod.
# Console Keycloak (admin/admin) : http://localhost:8083/auth/admin/ (404 via edge).
# Le Keycloak de dev racine (:8080) peut être arrêté pendant la recette (mémoire).

name: cfao-recette

services:
  keycloak-db:
    image: postgres:16-alpine
    mem_limit: 256m
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes: [keycloak-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    build: ../keycloak
    image: cfao-keycloak:recette
    mem_limit: 1024m
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Émetteur public : l'adresse de la passerelle, comme en prod.
      KC_HOSTNAME: http://localhost:8088/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_ADMIN: http://localhost:8083/auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
    depends_on:
      keycloak-db: { condition: service_healthy }
    # Console d'administration, poste local seulement.
    ports: ["127.0.0.1:8083:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Job : realm + comptes de démo, lus depuis le dépôt (pas besoin de rebâtir
  # l'image après une modification du realm). Idempotent.
  keycloak-config:
    image: cfao-keycloak:recette
    restart: "no"
    mem_limit: 512m
    entrypoint: ["java", "-jar", "/opt/cfao-config-cli/keycloak-config-cli.jar"]
    command: []
    depends_on:
      keycloak: { condition: service_healthy }
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/*.yaml,/config/dev/*.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_CACHE_ENABLED: "true"
      CFAO_PORTAL_SECRET: dev-portal-secret
      CFAO_SPA_ENABLED: "true"
    volumes:
      - ../keycloak/config:/config:ro

  edge:
    build: .
    image: cfao-edge:recette
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    environment:
      EDGE_LISTEN: "8088"
      EDGE_PUBLIC_PROTO: http
      EDGE_PUBLIC_HOST: localhost
      EDGE_PUBLIC_PORT: "8088"
      # Racine : le front vite (en prod, needs sert le portail à la racine).
      EDGE_NEEDS_UPSTREAM: host.docker.internal:5173
      EDGE_KEYCLOAK_UPSTREAM: keycloak:8080
      EDGE_PLANNING_UPSTREAM: host.docker.internal:8005
      EDGE_CR_UPSTREAM: ""
      EDGE_LAN: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak: { condition: service_healthy }
    ports: ["127.0.0.1:8088:8088"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8088"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  keycloak-db-data:
