# Inclus dans chaque bloc server (public et LAN). Un module arrêté ou en cours de
# mise à jour (502, 503, 504) répond 503 + Retry-After au lieu de l'erreur brute
# de nginx ; les 4xx passent intacts. Page HTML qui se recharge seule pour le
# navigateur, JSON {"detail":"maintenance"} pour les API (lu par
# frontend/src/lib/api.js). Les routes sans proxy_intercept_errors (API) ne
# remplacent que les erreurs de la passerelle, jamais les réponses du module.
set $edge_retry_after "";
set $edge_no_store "";
add_header Retry-After $edge_retry_after always;
add_header Cache-Control $edge_no_store always;

error_page 502 503 504 =503 /_edge/attente.$edge_attente;

location = /_edge/attente.html {
    internal;
    set $edge_retry_after 15;
    set $edge_no_store no-store;
    charset utf-8;
    default_type text/html;
    alias /usr/share/nginx/edge/attente.html;
}

location = /_edge/attente.json {
    internal;
    set $edge_retry_after 15;
    set $edge_no_store no-store;
    default_type application/json;
    return 503 '{"detail":"maintenance"}\n';
}
