# Inclus dans chaque location qui relaie : un seul proxy_set_header dans une
# location annule tous ceux hérités du server, d'où ce fichier commun.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $edge_connection;
proxy_set_header X-Request-ID $request_id;
# Les modules écrivent eux-mêmes leurs redirections : la passerelle n'y touche pas.
proxy_redirect off;
proxy_hide_header X-Powered-By;
