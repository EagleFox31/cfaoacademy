# Inclus dans chaque bloc server (public et LAN). « Vu comme » : le super admin
# consulte le portail d'un autre compte, en lecture seule. Toute requête qui
# porte X-Cfao-Vu-Comme et n'est ni GET ni HEAD est refusée ici, pour tous les
# modules, avant toute route ($edge_vu_comme_refus : map de nginx.conf). Les
# modules gardent leur propre refus : cette barrière n'en est que la première.
if ($edge_vu_comme_refus) {
    rewrite ^ /_edge/vu-comme.json last;
}

location = /_edge/vu-comme.json {
    internal;
    set $edge_no_store no-store;
    default_type application/json;
    return 403 '{"detail":"lecture seule"}\n';
}
