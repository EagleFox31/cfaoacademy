# Configuration fixe ; les routes viennent des modèles rendus dans /tmp/conf.d.
# Tout ce qui s'écrit va dans /tmp : le conteneur tourne en lecture seule.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Journal d'accès JSON (story 11-6). Jamais la query string (le `code` OIDC y
    # passe), ni Referer, ni Cookie, ni Authorization.
    log_format edge escape=json '{"time":"$time_iso8601","module":"$edge_module",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
        '"host":"$http_host","xfh":"$http_x_forwarded_host",'
        '"client":"$http_x_forwarded_for","remote":"$remote_addr","req_id":"$request_id"}';
    access_log /dev/stdout edge;

    # Page d'attente (snippets/attente.conf) : JSON pour les API et les appels
    # fetch, HTML pour une page ouverte dans le navigateur.
    map "$uri $http_accept" $edge_attente {
        default        json;
        "~^/api/"      json;
        "~text/html"   html;
    }

    include /tmp/conf.d/*.conf;
}
