# Tests policy portal_suggestion : qui propose, qui lit et traite (avec les refus).
name: PortalSuggestionSuite
description: Propositions de modification des portails, faites depuis l'aperçu

principals:
  directeur:
    id: d_1
    roles: ["center_director"]
  superadmin:
    id: s_1
    roles: ["superadmin"]
  coordinateur:
    id: c_1
    roles: ["training_coordinator"]
  assistante:
    id: c_2
    roles: ["center_assistant"]
  formateur:
    id: f_1
    roles: ["trainer"]
  admin_filiale:
    id: a_1
    roles: ["branch_admin"]
    attr:
      scopeNode: "groupe.cmr"
  apprenant:
    id: l_1
    roles: ["learner"]
  anonyme:
    id: x_1
    roles: ["_anon"]

resources:
  suggestion:
    kind: portal_suggestion
    id: r_1

tests:
  - name: le directeur du centre propose et suit les siennes, mais ne lit ni ne traite celles des autres
    input:
      principals: ["directeur"]
      resources: ["suggestion"]
      actions: ["create", "list_own", "list", "view", "update", "delete"]
    expected:
      - principal: directeur
        resource: suggestion
        actions:
          create: EFFECT_ALLOW
          list_own: EFFECT_ALLOW
          list: EFFECT_DENY
          view: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY

  - name: le superadmin propose, lit et traite, sans supprimer
    input:
      principals: ["superadmin"]
      resources: ["suggestion"]
      actions: ["create", "list_own", "list", "view", "update", "delete"]
    expected:
      - principal: superadmin
        resource: suggestion
        actions:
          create: EFFECT_ALLOW
          list_own: EFFECT_ALLOW
          list: EFFECT_ALLOW
          view: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_DENY

  - name: les autres profils ne proposent pas (négatif)
    input:
      principals: ["coordinateur", "assistante", "formateur", "admin_filiale", "apprenant", "anonyme"]
      resources: ["suggestion"]
      actions: ["create", "list_own", "list", "view"]
    expected:
      - principal: coordinateur
        resource: suggestion
        actions: { create: EFFECT_DENY, list_own: EFFECT_DENY, list: EFFECT_DENY, view: EFFECT_DENY }
      - principal: assistante
        resource: suggestion
        actions: { create: EFFECT_DENY, list_own: EFFECT_DENY, list: EFFECT_DENY, view: EFFECT_DENY }
      - principal: formateur
        resource: suggestion
        actions: { create: EFFECT_DENY, list_own: EFFECT_DENY, list: EFFECT_DENY, view: EFFECT_DENY }
      - principal: admin_filiale
        resource: suggestion
        actions: { create: EFFECT_DENY, list_own: EFFECT_DENY, list: EFFECT_DENY, view: EFFECT_DENY }
      - principal: apprenant
        resource: suggestion
        actions: { create: EFFECT_DENY, list_own: EFFECT_DENY, list: EFFECT_DENY, view: EFFECT_DENY }
      - principal: anonyme
        resource: suggestion
        actions: { create: EFFECT_DENY, list_own: EFFECT_DENY, list: EFFECT_DENY, view: EFFECT_DENY }
