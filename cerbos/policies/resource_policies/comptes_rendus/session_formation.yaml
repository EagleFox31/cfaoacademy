# Ressource « session_formation » — session du referentiel des formations.
# Default-deny : toute action non listee est refusee.
# `formateurs` (attribut de la ressource) : ids des animateurs rattaches a la session.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: session_formation
  schemas:
    principalSchema:
      ref: cerbos:///comptes_rendus/principal.json
    resourceSchema:
      ref: cerbos:///comptes_rendus/session.json
  rules:
    # La liste est ouverte aux formateurs, aux lecteurs et aux administrateurs ;
    # le tri session par session se fait ensuite par `read`.
    - actions: ["list"]
      effect: EFFECT_ALLOW
      roles: ["trainer", "ki", "pic", "lecteur_cr", "admin_referentiel", "superadmin"]

    # Lecteurs et administrateurs voient toutes les sessions.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["lecteur_cr", "admin_referentiel", "superadmin"]

    # Un formateur ne voit que les sessions qu'il anime.
    - actions: ["read", "marquer_absent"]
      effect: EFFECT_ALLOW
      roles: ["trainer", "ki", "pic"]
      condition:
        match:
          expr: request.principal.id in request.resource.attr.formateurs

    # Marquer un stagiaire absent : l'administrateur du referentiel, partout.
    - actions: ["marquer_absent"]
      effect: EFFECT_ALLOW
      roles: ["admin_referentiel"]
