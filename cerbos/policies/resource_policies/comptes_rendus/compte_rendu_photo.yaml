# Ressource « compte_rendu_photo » — photo jointe a un compte rendu.
# Default-deny : toute action non listee est refusee.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: compte_rendu_photo
  schemas:
    principalSchema:
      ref: cerbos:///comptes_rendus/principal.json
    resourceSchema:
      ref: cerbos:///comptes_rendus/ressource.json
  rules:
    # Formateurs certifies et suppleants (KI, PIC).
    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles: ["trainer", "ki", "pic"]

    # Uniquement sur ce qui leur appartient.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["trainer", "ki", "pic"]
      condition:
        match:
          expr: request.resource.attr.ownerId == request.principal.id

    # Equipe technique (PLATFORM_ROLES.md).
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["superadmin"]
