# Ressource « planning_my_trainer » : la fiche d'un formateur (pays, marques),
# lue par sa page profil. Chacun ne lit que la sienne (ownerSub = son
# identifiant de connexion) ; ni le coordinateur, ni un autre formateur.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: planning_my_trainer
  rules:
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - trainer
        - superadmin
      condition:
        match:
          expr: request.resource.attr.ownerSub == request.principal.id
