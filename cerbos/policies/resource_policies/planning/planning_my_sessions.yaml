# Ressource « planning_my_sessions » : les prochaines sessions d'un formateur.
# Chacun ne lit que les siennes (ownerSub = son identifiant de connexion) ;
# ni le coordinateur, ni le directeur, ni un autre formateur.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: planning_my_sessions
  rules:
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - trainer
        - superadmin
      condition:
        match:
          expr: request.resource.attr.ownerSub == request.principal.id
