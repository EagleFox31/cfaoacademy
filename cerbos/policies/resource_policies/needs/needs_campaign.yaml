# Ressource « needs_campaign » — la campagne elle-même et son référentiel.
#
# Lecture large : tout collaborateur CFAO doit voir la campagne en cours, ses
# dates et ses familles de catalogue, sinon il ne peut pas savoir qu'il a une
# fiche à remplir. Les comptes externes du realm commun (apprenants, candidats,
# partenaires B2B) n'y ont pas accès (`internal_staff`, derived_roles/staff.yaml).
#
# Écriture : deux niveaux distincts (derived_roles/needs_review.yaml).
#   - `academy_reviewer` instruit les dossiers → rien ici, tout est dans
#     needs_submission et needs_outbound.
#   - `academy_pilot` engage l'exercice → ouvrir, clôturer, importer, arbitrer.
#
# L'assistante du centre relit et valide toute la journée, mais n'ouvre ni ne
# clôture une campagne : refermer un exercice pendant que des filiales saisissent,
# ou rejouer un arbitrage déjà communiqué, ne se rattrape pas d'un clic.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: needs_campaign
  importDerivedRoles:
    - needs_review
    - staff
  rules:
    - actions: ["view", "list"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - internal_staff

    - actions: ["create", "update", "open", "close", "import", "arbitrate"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - academy_pilot
