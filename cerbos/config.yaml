# Cerbos PDP — configuration (architecture.md §4.4).
# Un seul bundle pour toute la plateforme : socle, needs, comptes rendus, planning.
# Default-deny : toute action absente des politiques est refusee.
server:
  httpListenAddr: ":3592"
  grpcListenAddr: ":3593"

storage:
  driver: "disk"
  disk:
    directory: /policies
    watchForChanges: true

# Seules les politiques qui declarent `schemas:` sont concernees (comptes rendus) :
# un attribut manquant ou mal type fait rejeter la demande.
schema:
  enforcement: reject

# Journal d'audit sur la sortie standard (rotation : pilote de journaux Docker).
# Pas le backend `local` : sa base Badger compacte en continu et tenait Cerbos
# collé à son plafond CPU au repos, ce qui faisait attendre chaque décision.
audit:
  enabled: true
  backend: file
  file:
    path: stdout
