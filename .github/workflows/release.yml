name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Alignement version & CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier VERSION / package.json / tag
        run: python scripts/verify_version.py "${{ github.ref_name }}"

      - name: Vérifier que CHANGELOG contient la version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/extract_changelog.py "$VERSION" > release_notes.md
          test -s release_notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  test:
    name: CI avant publication
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: GitHub Release
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Publier la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
