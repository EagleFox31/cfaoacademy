name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cerbos:
    name: Policies Cerbos (compile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: cerbos compile --tests (plateforme)
        run: |
          docker run --rm -v "${{ github.workspace }}/cerbos:/work" \
            ghcr.io/cerbos/cerbos:0.40.0 compile --tests=/work/tests /work/policies
      # Le module detachable a ses propres policies : sans cette etape, une
      # regression sur needs_submission / needs_outbound passerait en vert.
      - name: cerbos compile --tests (app 16 · recueil des besoins)
        run: |
          docker run --rm -v "${{ github.workspace }}/cfao-needs/cerbos:/work" \
            ghcr.io/cerbos/cerbos:0.40.0 compile --tests=/work/tests /work/policies

  core:
    name: cfao-core (Django · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-core
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cfao-core/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  needs:
    name: cfao-needs (app 16 · Django · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-needs/api
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cfao-needs/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  needs-web:
    name: cfao-needs (app 16 · Vite · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-needs/web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cfao-needs/web/package-lock.json
      - run: npm ci
      - run: npm run build

  operations:
    name: cfao-operations (Node · typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-operations
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cfao-operations/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: frontend (Vite · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: gitleaks/gitleaks-action@v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
