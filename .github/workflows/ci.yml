name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Chemins touchés
    runs-on: ubuntu-latest
    # paths-filter lit la liste des fichiers de la PR via l'API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mail: ${{ steps.filter.outputs.mail }}
      realm: ${{ steps.filter.outputs.realm }}
      edge: ${{ steps.filter.outputs.edge }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mail:
              - 'cfao-academy-mail/**'
              - '.github/workflows/ci.yml'
            realm:
              - 'keycloak/**'
              - 'cerbos/policies/**'
              - 'cfao-core/identity/roles.py'
              - 'cfao-core/core/auth/jwt_verifier.py'
              - '.github/workflows/ci.yml'
            edge:
              - 'edge/**'
              - 'keycloak/**'
              - '.github/workflows/ci.yml'

  cerbos:
    name: Policies Cerbos (compile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # Bundle unique (socle, needs, comptes rendus) : un PDP, une compilation.
      # Un set de derived roles en double ou un schema introuvable y echoue.
      - name: cerbos compile --tests (bundle plateforme)
        run: |
          docker run --rm -v "${{ github.workspace }}/cerbos:/work" \
            ghcr.io/cerbos/cerbos:0.40.0 compile --tests=/work/tests /work/policies
      # Un seul bundle : aucun module ne doit recreer son propre dossier de policies.
      # Exception : le gabarit garde un exemple autonome, jamais deploye.
      - name: aucun bundle Cerbos de module
        run: |
          ecarts=$(find . \( -path ./cerbos -o -path ./template-service \) -prune -o -path '*/cerbos/policies' -type d -print)
          if [ -n "$ecarts" ]; then
            echo "$ecarts"
            echo "Les policies vivent dans cerbos/ a la racine." >&2
            exit 1
          fi

  auth-commune:
    name: Vérification JWT commune (copies identiques)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reference : cfao-core/core/auth/jwt_verifier.py et son test. Chaque module
      # en garde une copie (modules detachables) : une copie divergente echoue ici.
      - name: copies identiques a la reference
        run: |
          ecart=0
          for ref in cfao-core/core/auth/jwt_verifier.py cfao-core/core/tests/test_jwt_verifier.py; do
            for copie in $(find . -name "$(basename "$ref")" -not -path "./$ref" -not -path '*/node_modules/*'); do
              cmp -s "$ref" "$copie" && echo "ok $copie" || { echo "::error file=$copie::differe de $ref"; ecart=1; }
            done
          done
          exit $ecart

  realm:
    name: Realm Keycloak commun (cohérence + smoke KC 26)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      needs.changes.outputs.realm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: keycloak/tests/requirements.txt
      - run: pip install -r keycloak/tests/requirements.txt
      # Rôles alignés sur le catalogue core et sur Cerbos, audiences, session 8 h.
      - run: pytest -q keycloak/tests
      # Vrai Keycloak : realm appliqué par config-cli, jetons obtenus par les vrais flux.
      - name: smoke sur Keycloak 26
        run: |
          f=keycloak/tests/docker-compose.smoke.yml
          docker compose -f $f up -d keycloak
          docker compose -f $f run --rm config
          KC_URL=http://localhost:18080 pytest -q keycloak/tests/smoke_realm.py
      # Keycloak neuf (H2 en mémoire), realm sans les comptes de démo.
      - name: smoke en configuration prod (SPA de dev coupée, secret injecté, sans démo)
        env:
          CFAO_SPA_ENABLED: "false"
          CFAO_PORTAL_SECRET: ci-secret-portail
          SMOKE_IMPORT: /config/*.yaml,/fixtures/*.yaml
        run: |
          f=keycloak/tests/docker-compose.smoke.yml
          docker compose -f $f up -d --force-recreate keycloak
          docker compose -f $f run --rm config
          KC_URL=http://localhost:18080 SPA_ATTENDUE=disabled DEMO_ATTENDUE=absente pytest -q keycloak/tests/smoke_realm.py
          # Migration des comptes de module (L5) : vrais flux de connexion, rejeu sans effet.
          KC_URL=http://localhost:18080 pytest -q keycloak/tests/smoke_migration.py
          docker compose -f $f down -v
      # L'image publiée et son compose de prod, tels quels : build optimisé, Postgres,
      # realm embarqué (sans dev/), aucun secret par défaut.
      - name: smoke de l'image de prod (compose.prod.yml)
        env:
          KC_VERSION: smoke
          KC_PORT: "18080"
          KC_HOSTNAME: http://localhost:18080/auth
          KC_HOSTNAME_ADMIN: http://localhost:18080/auth
          KC_DB_PASSWORD: ci-db
          KC_ADMIN_PASSWORD: ci-admin
          CFAO_PORTAL_SECRET: ci-secret-portail
          KC_IMPORT_LOCATIONS: /opt/cfao-realm/*.yaml,/fixtures/*.yaml
          # Deux hôtes à la fois : un changement d'hôte se fait sans rupture.
          CFAO_PORTAL_REDIRECT_URIS: '["http://localhost:8000/oauth2/callback","https://portail.exemple/oauth2/callback"]'
          CFAO_NEEDS_REDIRECT_URIS: '["http://localhost:8082/*","https://needs.exemple/*"]'
          EMETTEUR_ATTENDU: http://localhost:18080/auth/realms/cfao
        run: |
          docker build -q -t antifragile237/cfao-keycloak:smoke keycloak
          p="-f keycloak/compose.prod.yml -f keycloak/tests/compose.prod.smoke.yml"
          docker compose $p up -d --wait keycloak
          docker compose $p run --rm config
          KC_URL=http://localhost:18080/auth SPA_ATTENDUE=disabled DEMO_ATTENDUE=absente pytest -q keycloak/tests/smoke_realm.py
          KC_URL=http://localhost:18080/auth pytest -q keycloak/tests/smoke_migration.py
      - if: failure()
        run: |
          docker compose -f keycloak/tests/docker-compose.smoke.yml logs --tail=200
          docker compose -f keycloak/compose.prod.yml logs --tail=200 || true

  edge:
    name: Passerelle commune (config + smoke devant Keycloak 26)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    env:
      # Keycloak commun, servi sous /auth derrière la passerelle (18088).
      KC_VERSION: smoke
      KC_PORT: "18080"
      KC_HOSTNAME: http://localhost:18088/auth
      KC_HOSTNAME_ADMIN: http://localhost:18080/auth
      KC_DB_PASSWORD: ci-db
      KC_ADMIN_PASSWORD: ci-admin
      CFAO_PORTAL_SECRET: ci-secret-portail
      KC_IMPORT_LOCATIONS: /opt/cfao-realm/*.yaml,/fixtures/*.yaml
      CFAO_PORTAL_REDIRECT_URIS: '[]'
      CFAO_NEEDS_REDIRECT_URIS: '["http://localhost:18088/*"]'
      # Passerelle et modules factices.
      EDGE_VERSION: smoke
      EDGE_LISTEN: 127.0.0.1:18088
      EDGE_PUBLIC_PROTO: http
      EDGE_PUBLIC_HOST: localhost
      EDGE_PUBLIC_PORT: "18088"
      EDGE_NEEDS_UPSTREAM: 127.0.0.1:18081
      EDGE_KEYCLOAK_UPSTREAM: 127.0.0.1:18080
      EDGE_CR_UPSTREAM: 127.0.0.1:18092
      EDGE_LAN: needs@127.0.0.1:18093 cr@127.0.0.1:18094
      # Tests.
      EDGE_URL: http://localhost:18088
      EDGE_LAN_NEEDS_URL: http://127.0.0.1:18093
      EDGE_LAN_CR_URL: http://127.0.0.1:18094
      EDGE_HTTPS_URL: http://localhost:18089
      KC_INTERNE: http://localhost:18080/auth
      EMETTEUR_ATTENDU: http://localhost:18088/auth/realms/cfao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: keycloak/tests/requirements.txt
      - run: pip install -r keycloak/tests/requirements.txt
      - run: pytest -q edge/tests/test_edge_config.py
      - name: image + nginx -t avec les valeurs du modèle de prod
        run: |
          docker build -q -t antifragile237/cfao-edge:smoke edge
          docker run --rm --network none --env-file edge/.env.prod.example antifragile237/cfao-edge:smoke nginx -t
      - name: Keycloak commun (image de prod) + realm
        run: |
          docker build -q -t antifragile237/cfao-keycloak:smoke keycloak
          p="-f keycloak/compose.prod.yml -f keycloak/tests/compose.prod.smoke.yml"
          docker compose $p up -d --wait keycloak
          docker compose $p run --rm config
      - name: passerelle + modules factices
        run: |
          docker compose -p cfao-edge-smoke -f edge/compose.prod.yml -f edge/tests/compose.smoke.yml up -d --wait
          # Même image, sans Keycloak ni CR, en https : HSTS et retour sur needs.
          docker run -d --name edge-https --network host \
            -e EDGE_LISTEN=127.0.0.1:18089 -e EDGE_PUBLIC_PROTO=https \
            -e EDGE_PUBLIC_HOST=localhost -e EDGE_PUBLIC_PORT=443 \
            -e EDGE_NEEDS_UPSTREAM=127.0.0.1:18081 \
            antifragile237/cfao-edge:smoke
          sleep 3
      - run: pytest -q edge/tests/smoke_edge.py
      - if: failure()
        run: |
          docker compose -p cfao-edge-smoke -f edge/compose.prod.yml -f edge/tests/compose.smoke.yml logs --tail=200 || true
          docker logs --tail=100 edge-https || true
          docker compose -f keycloak/compose.prod.yml logs --tail=200 || true

  core:
    name: cfao-core (Django · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-core
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cfao-core/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  needs:
    name: cfao-needs (app 16 · Django · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-needs/api
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cfao-needs/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  needs-web:
    name: cfao-needs (app 16 · Vite · test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-needs/web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cfao-needs/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  operations:
    name: cfao-operations (Node · typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-operations
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cfao-operations/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mail:
    name: cfao-academy-mail (Django · pytest)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      needs.changes.outputs.mail == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-academy-mail/api
    env:
      MAIL_SECRET_KEY: ci-test-secret
      MAIL_INBOUND_KEY: ci-test-inbound
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cfao-academy-mail/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: frontend (Vite · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  cr-web:
    name: cfao-comptes-rendus/web (Vite · tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-comptes-rendus/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cfao-comptes-rendus/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  rapports:
    name: cfao-comptes-rendus (Django · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-comptes-rendus/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cfao-comptes-rendus/api/requirements*.txt
      # Carlito, comme l'image (Dockerfile) : les etiquettes de l'anneau sont
      # mesurees aux metriques de Calibri ; Liberation, plus large, les deplace.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito
      - run: pip install -r requirements-dev.txt
      # Le rendu LibreOffice est saute sans LibreOffice ; le reste s'execute.
      - run: pytest -q

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    # gitleaks-action liste les commits de la PR pour les scanner : sans
    # `pull-requests: read`, l'appel API renvoie 403 et le job echoue AVANT tout
    # scan. Le workflow ne declarait que `contents: read` — ce job ne pouvait donc
    # jamais reussir sur un evenement `pull_request`.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: gitleaks/gitleaks-action@v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
