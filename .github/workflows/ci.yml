name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cerbos:
    name: Policies Cerbos (compile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cerbos compile --tests
        run: |
          docker run --rm -v "${{ github.workspace }}/cerbos:/work" \
            ghcr.io/cerbos/cerbos:0.40.0 compile --tests=/work/tests /work/policies
      - name: cerbos compile --tests (comptes rendus)
        run: |
          docker run --rm -v "${{ github.workspace }}/cfao-comptes-rendus/cerbos:/work" \
            ghcr.io/cerbos/cerbos:0.40.0 compile --tests=/work/tests /work/policies

  core:
    name: cfao-core (Django · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cfao-core/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  operations:
    name: cfao-operations (Node · typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cfao-operations/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: frontend (Vite · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  cr-web:
    name: cfao-comptes-rendus/web (Vite · tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-comptes-rendus/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cfao-comptes-rendus/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  rapports:
    name: cfao-comptes-rendus (Django · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfao-comptes-rendus/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cfao-comptes-rendus/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Le rendu LibreOffice est saute sans LibreOffice ; le reste s'execute.
      - run: pytest -q

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
