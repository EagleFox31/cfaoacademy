# Ressource « compte_rendu » — brouillon de compte rendu d'un formateur.
# Default-deny : toute action non listee est refusee.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: compte_rendu
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///ressource.json
  rules:
    # Formateurs certifies et suppleants (KI, PIC).
    - actions: ["list", "create"]
      effect: EFFECT_ALLOW
      roles: ["trainer", "ki", "pic"]

    # Uniquement sur ce qui leur appartient.
    - actions: ["read", "update", "delete"]
      effect: EFFECT_ALLOW
      roles: ["trainer", "ki", "pic"]
      condition:
        match:
          expr: request.resource.attr.ownerId == request.principal.id

    # Equipe technique (PLATFORM_ROLES.md).
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["superadmin"]
