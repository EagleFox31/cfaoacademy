# Passerelle du module — sert l'interface et route l'API.
# Seul point d'entree du module : l'API n'est pas publiee.
server {
    listen 80;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Les polices viennent de Google Fonts ; les apercus, photos et exports
    # sont des blobs / data: fabriques dans le navigateur (exceljs, jszip).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    client_max_body_size 25m;   # une photo arrive entiere dans la requete

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Tout est servi sous /cr/ (préfixe de cfao-edge, conservé jusqu'ici) ;
    # l'API ne connaît que ses chemins sans préfixe.
    absolute_redirect off;

    location ~ ^/cr/(apercu|cr-donnees)/ {
        rewrite ^/cr(/.*)$ $1 break;
        proxy_pass http://api:5175;
        # L'identite ne vient jamais d'un en-tete du client : X-User-ID
        # (mode autonome) est vide avant d'atteindre l'API.
        proxy_set_header X-User-ID "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 300s;   # un rapport complet est produit sans tache de fond
        proxy_send_timeout 300s;
    }

    # Fichiers empreints par Vite : cachables longtemps.
    location /cr/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        try_files $uri =404;
    }

    location /cr/ {
        root /usr/share/nginx/html;
        try_files $uri /cr/index.html;
    }

    location = /cr {
        return 308 /cr/;
    }

    # Anciens liens (servis à la racine avant /cr/) : redirigés, relatifs.
    location / {
        return 308 /cr$request_uri;
    }
}
