# Module « comptes rendus formateur » en production : images Docker Hub
# (antifragile237), aucun fichier source sur le serveur.
#   1. Copier ce fichier, deploy.sh|ps1, reprise.sh|ps1 et env.prod.example dans un dossier.
#   2. ./deploy.sh (ou .\deploy.ps1) : genere les secrets dans .env, deduit l'adresse LAN, demarre.
#   3. Une fois : ./reprise.sh <export formateurs> (base, photos et profils).
#   4. Creer chaque compte : docker compose -f docker-compose.prod.yml exec api python manage.py mot_de_passe <identifiant>
# Mode local : comptes a mot de passe du module, sans Keycloak. Les vrais
# profils se deposent dans le volume cr-donnees (/donnees/profils-locaux.json).
name: cfao-comptes-rendus

x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *journaux
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comptes_rendus}
      POSTGRES_USER: ${POSTGRES_USER:-comptes_rendus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - cr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comptes_rendus} -d ${POSTGRES_DB:-comptes_rendus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cerbos:
    image: antifragile237/cfao-comptes-rendus-cerbos:${CR_VERSION:-v0.4.1}
    restart: unless-stopped
    logging: *journaux
    mem_limit: 256m
    environment:
      CERBOS_NO_TELEMETRY: "1"
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    image: antifragile237/cfao-comptes-rendus-api:${CR_VERSION:-v0.4.1}
    restart: unless-stopped
    logging: *journaux
    mem_limit: 1g
    env_file: .env
    # Explicite : les images deja publiees migraient encore dans leur CMD.
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:5175", "--workers", "1", "--threads", "8", "--timeout", "300", "--access-logfile", "-"]
    environment: &api_env
      DEPLOYMENT_MODE: local
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY est obligatoire (aleatoire, 50 caracteres)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS est obligatoire (nom public du module)}
      ORIGINES_AUTORISEES: ${ORIGINES_AUTORISEES:?ORIGINES_AUTORISEES est obligatoire (origine publique exacte)}
      # True derriere HTTPS ; False seulement en HTTP sur un reseau de confiance.
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE est obligatoire (True derriere HTTPS)}
      COOKIE_SESSION: ${COOKIE_SESSION:-cfao_cr_session}
      COMPTES_LOCAUX: /donnees/comptes.sqlite3
      PROFILS_LOCAUX: ${PROFILS_LOCAUX:-/donnees/profils-locaux.json}
      DATABASE_URL: postgres://${POSTGRES_USER:-comptes_rendus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-comptes_rendus}
      CERBOS_HTTP: http://cerbos:3592
    volumes:
      - cr-donnees:/donnees
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      cerbos: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5175/apercu/sante"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Job ponctuel (AGENTS.md section 7) : migrations + compte technique manquant,
  # puis sortie en 0. Rejouable sans ecriture ; un mot de passe change n'est
  # jamais ecrase. S'il echoue, l'API ne demarre pas : `docker compose logs migrate`.
  migrate:
    image: antifragile237/cfao-comptes-rendus-api:${CR_VERSION:-v0.4.1}
    restart: "no"
    logging: *journaux
    mem_limit: 512m
    env_file: .env
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py compte_technique"]
    environment: *api_env
    volumes:
      - cr-donnees:/donnees
    depends_on:
      db: { condition: service_healthy }

  gateway:
    image: antifragile237/cfao-comptes-rendus-gateway:${CR_VERSION:-v0.4.1}
    restart: unless-stopped
    logging: *journaux
    mem_limit: 128m
    ports:
      # 127.0.0.1 par defaut : ne l'elargir que derriere un proxy TLS (README, « Exposer en interne »).
      - "${CR_BIND:-127.0.0.1}:${CR_PORT:-8090}:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  cr-db:
  cr-donnees:
