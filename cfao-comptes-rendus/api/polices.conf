<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Polices du modele absentes sous Linux (Gotham, Arial Nova, Brandon) :
     remplacees par Liberation Sans, aux metriques d'Arial, comme LibreOffice
     le fait sous Windows. Sans ces regles, la police de secours n'a pas les
     memes chasses et le texte des apercus se disloque. -->
<fontconfig>
  <alias binding="same"><family>Gotham Black</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Gotham</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial Nova</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial Nova Light</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Brandon Grotesque Medium</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
</fontconfig>
