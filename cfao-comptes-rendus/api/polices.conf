<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Le theme du modele utilise Arial Nova et Brandon Grotesque, absentes de
     l'image : sans ces regles, fontconfig leur substitue Liberation Mono
     (seule police trouvee en premier), une chasse fixe qui ouvre des espaces
     autour des lettres etroites dans les apercus. -->
<fontconfig>
  <alias binding="same"><family>Arial Nova</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial Nova Light</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Brandon Grotesque Medium</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <!-- Toute autre police inconnue : a chasse variable, jamais Mono. -->
  <match target="pattern"><edit name="family" mode="append_last"><string>Liberation Sans</string></edit></match>
</fontconfig>
