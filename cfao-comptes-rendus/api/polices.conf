<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Les polices du modele absentes de l'image prennent la meme remplacante
     que dans le rendu Windows (docs/etude-polices-rendu.md) : Gotham Black
     en Arial Black, Arial Nova et Brandon en Carlito (metrique de Calibri).
     Sans ces regles, fontconfig leur substituait Liberation Mono, une chasse
     fixe qui ouvrait des espaces autour des lettres etroites. -->
<fontconfig>
  <alias binding="same"><family>Gotham Black</family><prefer><family>Arial Black</family></prefer></alias>
  <alias binding="same"><family>Arial Nova</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Arial Nova Light</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Brandon Grotesque Medium</family><prefer><family>Carlito</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <!-- Toute autre police inconnue : a chasse variable, jamais Mono. -->
  <match target="pattern"><edit name="family" mode="append_last"><string>Liberation Sans</string></edit></match>
</fontconfig>
