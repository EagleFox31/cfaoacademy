# Service des comptes rendus seul, pour le developper hors plateforme
# (mode autonome : profils fictifs de `api/profils-locaux.json`).
# Dans la plateforme, il est declare par le docker-compose.yml racine.
name: cfao-comptes-rendus

services:
  comptes-rendus-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${DB_NAME:-comptes_rendus}
      POSTGRES_USER: ${DB_USER:-comptes_rendus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
    volumes:
      - comptes-rendus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-comptes_rendus} -d ${DB_NAME:-comptes_rendus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  comptes-rendus-cerbos:
    image: ghcr.io/cerbos/cerbos:0.40.0
    restart: unless-stopped
    mem_limit: 256m
    command: ["server", "--config=/config/config.yaml"]
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - ./cerbos/policies:/policies:ro
      - ./cerbos/config.yaml:/config/config.yaml:ro
    # Pas de port publie : seul le service l'interroge.
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5

  comptes-rendus-api:
    build: .
    restart: unless-stopped
    mem_limit: 1g
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-comptes_rendus}:${DB_PASSWORD}@comptes-rendus-db:5432/${DB_NAME:-comptes_rendus}
      CERBOS_HTTP: http://comptes-rendus-cerbos:3592
    ports:
      - "127.0.0.1:${API_PORT:-5175}:5175"
    volumes:
      - comptes-rendus-donnees:/donnees
    depends_on:
      comptes-rendus-db: { condition: service_healthy }
      comptes-rendus-cerbos: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5175/apercu/sante"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  comptes-rendus-db:
  comptes-rendus-donnees:
