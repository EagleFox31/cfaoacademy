# Module « comptes rendus formateur » (story 04-5), detachable : cette pile
# se lance seule, sans rien emprunter au reste du depot.
#   cp .env.example .env && docker compose up --build -d
# Interface et API : http://localhost:8090 (CR_PORT). Seule la passerelle
# est publiee (127.0.0.1 par defaut, CR_BIND) ; l'API, la base et Cerbos restent
# sur le reseau interne.
# Dans la plateforme, le service est declare par le docker-compose.yml racine.
name: cfao-comptes-rendus

# Journaux bornes (3 x 10 Mo par conteneur) : sans cela, ils grossissent
# sans fin sur le disque de Docker.
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *journaux
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comptes_rendus}
      POSTGRES_USER: ${POSTGRES_USER:-comptes_rendus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - cr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comptes_rendus} -d ${POSTGRES_DB:-comptes_rendus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.40.0
    restart: unless-stopped
    logging: *journaux
    mem_limit: 256m
    command: ["server", "--config=/config/config.yaml"]
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - ./cerbos/policies:/policies:ro
      - ./cerbos/config.yaml:/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    logging: *journaux
    mem_limit: 1g
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-comptes_rendus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-comptes_rendus}
      CERBOS_HTTP: http://cerbos:3592
      # Le module fixe son propre nom de cookie (meme hote = meme site que le portail).
      COOKIE_SESSION: ${COOKIE_SESSION:-cfao_cr_session}
      # Pages autorisees a ecrire : la passerelle, sur son port publie.
      ORIGINES_AUTORISEES: ${ORIGINES_AUTORISEES:-http://localhost:${CR_PORT:-8090},http://127.0.0.1:${CR_PORT:-8090}}
    volumes:
      # Photos, rapports produits et, en mode local, empreintes des mots de passe.
      - cr-donnees:/donnees
    depends_on:
      db: { condition: service_healthy }
      cerbos: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5175/apercu/sante"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    logging: *journaux
    mem_limit: 128m
    ports:
      # CR_BIND : 127.0.0.1 par defaut ; ne l'elargir que derriere un proxy TLS (voir README).
      - "${CR_BIND:-127.0.0.1}:${CR_PORT:-8090}:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  cr-db:
  cr-donnees:
