name: cfao-template-service

services:
  service-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${DB_NAME:-service_db}
      POSTGRES_USER: ${DB_USER:-service_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
    volumes:
      - service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-service_user} -d ${DB_NAME:-service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-cerbos:
    image: ghcr.io/cerbos/cerbos:0.40.0
    restart: unless-stopped
    mem_limit: 256m
    command: ["server", "--config=/config/cerbos.yaml"]
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - ./cerbos/policies:/policies:ro
      - ./cerbos/cerbos.yaml:/config/cerbos.yaml:ro
    ports:
      - "${CERBOS_PORT:-3592}:3592"
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/cerbos.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5

  service-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-service_user}:${DB_PASSWORD}@service-db:5432/${DB_NAME:-service_db}
      CERBOS_HTTP: http://service-cerbos:3592
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
    depends_on:
      service-db:
        condition: service_healthy
      service-cerbos:
        condition: service_healthy

volumes:
  service-db-data:
