name: cfao-template-service

services:
  service-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${DB_NAME:-service_db}
      POSTGRES_USER: ${DB_USER:-service_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
    volumes:
      - service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-service_user} -d ${DB_NAME:-service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-cerbos:
    image: ghcr.io/cerbos/cerbos:0.40.0
    restart: unless-stopped
    mem_limit: 256m
    command: ["server", "--config=/config/cerbos.yaml"]
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - ./cerbos/policies:/policies:ro
      - ./cerbos/cerbos.yaml:/config/cerbos.yaml:ro
    ports:
      - "${CERBOS_PORT:-3592}:3592"
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/cerbos.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5

  service-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment: &api_env
      DATABASE_URL: postgres://${DB_USER:-service_user}:${DB_PASSWORD}@service-db:5432/${DB_NAME:-service_db}
      CERBOS_HTTP: http://service-cerbos:3592
    # cfao-maillage : appels d'API entre modules. Renommer service-api en
    # <module>-api (nom unique sur ce reseau). A retirer si le module n'appelle
    # aucun autre module et n'est appele par aucun.
    networks: [default, cfao-maillage]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
    depends_on:
      service-db:
        condition: service_healthy
      service-migrate:
        condition: service_completed_successfully
      service-cerbos:
        condition: service_healthy

  # Job ponctuel (AGENTS.md section 7) : schema + referentiel manquant, puis
  # sortie en 0. Rejouable sans ecriture ; aucune donnee de prod ecrasee.
  # Ne jamais migrer dans le CMD ou l'entrypoint de l'API.
  service-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    mem_limit: 384m
    env_file: .env
    environment: *api_env
    volumes:
      - ./api:/app
    # Dev : comptes et donnees de demonstration. Un compose de prod lance
    # `bootstrap` seul.
    command: ["python", "manage.py", "bootstrap", "--demo"]
    depends_on:
      service-db:
        condition: service_healthy

networks:
  # Reseau de maillage inter-modules : seules les API le rejoignent, les bases
  # restent sur le reseau prive du module. Volontairement PAS `external` : le
  # premier module demarre le cree, aucune commande prealable (AGENTS.md section 7).
  # Cle et nom identiques partout (edge/tests/test_edge_config.py le verifie).
  cfao-maillage:
    name: cfao-maillage

volumes:
  service-db-data:
