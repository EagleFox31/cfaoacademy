# CFAO Needs — production, derrière la passerelle commune cfao-edge.
# Toutes les images proviennent directement de votre Docker Hub (antifragile237).
# Prérequis : le Keycloak commun (keycloak/compose.prod.yml, projet cfao-identity)
# tourne, et cfao-edge publie needs et /auth. Puis :
#   docker compose -f docker-compose.prod.yml up -d
# Le job needs-migrate crée ou complète la base à chaque `up` (AGENTS.md §7) :
# migrations + référentiel manquant, jamais d'écrasement. S'il échoue, l'API et
# le worker ne démarrent pas : lire `docker compose logs needs-migrate`.
# Connexion : realm `cfao`, client cfao-needs-web, audience cfao-needs-api.

name: cfao-needs

services:
  needs-cerbos:
    mem_limit: 256m
    restart: unless-stopped
    image: antifragile237/cfao-needs-cerbos:v0.1.0
    command: ["server", "--config=/config/cerbos.yaml"]
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - needs-cerbos-audit:/audit
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/cerbos.yaml"]
      interval: 30s
      timeout: 5s
      retries: 10

  needs-db:
    mem_limit: 512m
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NEEDS_DB_NAME:-needs}
      POSTGRES_USER: ${NEEDS_DB_USER:-needs}
      POSTGRES_PASSWORD: ${NEEDS_DB_PASSWORD:-ZyHDiHqm8UMIbsNy5Hmoi2Cl}
    volumes:
      - needs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEEDS_DB_USER:-needs}"]
      interval: 20s
      timeout: 5s
      retries: 10

  needs-api:
    mem_limit: 512m
    restart: unless-stopped
    image: antifragile237/cfao-needs-api:v0.1.4
    environment: &api_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      NEEDS_SECRET_KEY: ${NEEDS_SECRET_KEY:-ueDBVqGE8R7OzHALv+e5Hnp710zP2xf1A4uWlC+7oPA5pxtctl3LmKPzo01PYrbf}
      NEEDS_DEPLOYMENT_MODE: ${NEEDS_DEPLOYMENT_MODE:-standalone}
      NEEDS_DB_HOST: needs-db
      NEEDS_DB_NAME: ${NEEDS_DB_NAME:-needs}
      NEEDS_DB_USER: ${NEEDS_DB_USER:-needs}
      NEEDS_DB_PASSWORD: ${NEEDS_DB_PASSWORD:-ZyHDiHqm8UMIbsNy5Hmoi2Cl}
      CERBOS_HTTP: http://needs-cerbos:3592
      # Clés lues en interne, sur le réseau du Keycloak commun.
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/auth/realms/cfao/protocol/openid-connect/certs}
      # Émetteur canonique : KC_HOSTNAME du Keycloak commun + /realms/cfao.
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER manquant (ex. https://<hote>/auth/realms/cfao)}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-cfao-needs-api}
      NEEDS_CORS_ORIGINS: ${NEEDS_CORS_ORIGINS:-http://localhost:8082,http://localhost:8080,http://localhost:5174}
      NEEDS_PUBLIC_BASE_URL: ${NEEDS_PUBLIC_BASE_URL:-http://localhost:8082}
      NEEDS_INTERNAL_DOMAINS: ${NEEDS_INTERNAL_DOMAINS:-cfao.com}
      NEEDS_TEAM_RECIPIENTS: ${NEEDS_TEAM_RECIPIENTS:-academy@cfao.com}
      NEEDS_EMAIL_BACKEND: ${NEEDS_EMAIL_BACKEND:-console}
      NEEDS_SMTP_HOST: ${NEEDS_SMTP_HOST:-}
    networks: [default, identite]
    depends_on:
      needs-db:
        condition: service_healthy
      needs-migrate:
        condition: service_completed_successfully
      needs-cerbos:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-S", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/needs/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Job ponctuel : schéma + référentiel manquant, puis sortie en 0. Même image
  # que l'API : le code qui migre est celui qui sert.
  needs-migrate:
    mem_limit: 384m
    restart: "no"
    image: antifragile237/cfao-needs-api:v0.1.4
    command: ["python", "manage.py", "bootstrap"]
    environment: *api_env
    networks: [default]
    depends_on:
      needs-db:
        condition: service_healthy

  # Même image que l'API (l'image worker dédiée n'était plus reconstruite).
  needs-worker:
    mem_limit: 384m
    restart: unless-stopped
    image: antifragile237/cfao-needs-api:v0.1.4
    command: ["python", "manage.py", "qcluster"]
    environment: *api_env
    depends_on:
      needs-migrate:
        condition: service_completed_successfully

  needs-gateway:
    mem_limit: 64m
    restart: unless-stopped
    image: antifragile237/cfao-needs-gateway:v0.2.0
    environment:
      # Absolu : le LAN (sans /auth) se connecte aussi sur l'émetteur public.
      NEEDS_OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER manquant}
      NEEDS_OIDC_CLIENT_ID: ${NEEDS_OIDC_CLIENT_ID:-cfao-needs-web}
    # Local par défaut : cfao-edge est la seule entrée (zrok et LAN).
    ports:
      - "${NEEDS_BIND:-127.0.0.1}:${NEEDS_PORT:-8082}:80"
    depends_on:
      needs-api:
        condition: service_started

networks:
  # Réseau du Keycloak commun (projet compose cfao-identity), créé par lui.
  identite:
    name: ${IDENTITY_NETWORK:-cfao-identity_default}
    external: true

volumes:
  needs-db-data:
  needs-cerbos-audit:
