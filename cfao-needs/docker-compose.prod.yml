# CFAO Needs — Stack complète clé-en-main (Zero Build / Turnkey)
# Toutes les images proviennent directement de votre Docker Hub (antifragile237).
# Lancement immédiat sur n'importe quelle machine sans aucun fichier source :
#   docker compose -f docker-compose.prod.yml up -d

name: cfao-needs

services:
  needs-kc-db:
    mem_limit: 256m
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-2P09iYigO13G6kc4ti+trLQ7}
    volumes:
      - needs-kc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 20s
      timeout: 5s
      retries: 10

  needs-keycloak:
    mem_limit: 768m
    restart: unless-stopped
    image: antifragile237/cfao-needs-keycloak:v0.1.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://needs-kc-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-2P09iYigO13G6kc4ti+trLQ7}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-${KC_ADMIN:-admin}}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-${KC_ADMIN_PASSWORD:-4g3BOwwdgL46ful1}}
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-4g3BOwwdgL46ful1}
      KC_HOSTNAME: ${NEEDS_PUBLIC_BASE_URL:-http://localhost:${NEEDS_PORT:-8082}}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      NEEDS_LAN_HOST: ${NEEDS_LAN_HOST:-}
      NEEDS_PUBLIC_BASE_URL: ${NEEDS_PUBLIC_BASE_URL:-}
      KEYCLOAK_ADDITIONAL_REDIRECT_URIS: ${KEYCLOAK_ADDITIONAL_REDIRECT_URIS:-}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx256m"
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.replace-placeholders=true"
      NEEDS_DEMO_PASSWORD: ${NEEDS_DEMO_PASSWORD:-Recette2027!}
    depends_on:
      needs-kc-db:
        condition: service_healthy
    ports:
      - "${KC_PORT:-8081}:8080"

  needs-cerbos:
    mem_limit: 256m
    restart: unless-stopped
    image: antifragile237/cfao-needs-cerbos:v0.1.0
    command: ["server", "--config=/config/cerbos.yaml"]
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - needs-cerbos-audit:/audit
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/cerbos.yaml"]
      interval: 30s
      timeout: 5s
      retries: 10

  needs-db:
    mem_limit: 512m
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NEEDS_DB_NAME:-needs}
      POSTGRES_USER: ${NEEDS_DB_USER:-needs}
      POSTGRES_PASSWORD: ${NEEDS_DB_PASSWORD:-ZyHDiHqm8UMIbsNy5Hmoi2Cl}
    volumes:
      - needs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEEDS_DB_USER:-needs}"]
      interval: 20s
      timeout: 5s
      retries: 10

  needs-api:
    mem_limit: 512m
    restart: unless-stopped
    image: antifragile237/cfao-needs-api:v0.1.3
    environment: &api_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      NEEDS_SECRET_KEY: ${NEEDS_SECRET_KEY:-ueDBVqGE8R7OzHALv+e5Hnp710zP2xf1A4uWlC+7oPA5pxtctl3LmKPzo01PYrbf}
      NEEDS_DEPLOYMENT_MODE: ${NEEDS_DEPLOYMENT_MODE:-standalone}
      NEEDS_DB_HOST: needs-db
      NEEDS_DB_NAME: ${NEEDS_DB_NAME:-needs}
      NEEDS_DB_USER: ${NEEDS_DB_USER:-needs}
      NEEDS_DB_PASSWORD: ${NEEDS_DB_PASSWORD:-ZyHDiHqm8UMIbsNy5Hmoi2Cl}
      CERBOS_HTTP: http://needs-cerbos:3592
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://needs-keycloak:8080/realms/cfao-needs/protocol/openid-connect/certs}
      OIDC_ISSUER: ${OIDC_ISSUER:-${NEEDS_PUBLIC_BASE_URL:-http://localhost:8082}/realms/cfao-needs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-needs-web}
      NEEDS_CORS_ORIGINS: ${NEEDS_CORS_ORIGINS:-http://localhost:8082,http://localhost:8080,http://localhost:5174}
      NEEDS_PUBLIC_BASE_URL: ${NEEDS_PUBLIC_BASE_URL:-http://localhost:8082}
      NEEDS_INTERNAL_DOMAINS: ${NEEDS_INTERNAL_DOMAINS:-cfao.com}
      NEEDS_TEAM_RECIPIENTS: ${NEEDS_TEAM_RECIPIENTS:-academy@cfao.com}
      NEEDS_EMAIL_BACKEND: ${NEEDS_EMAIL_BACKEND:-console}
      NEEDS_SMTP_HOST: ${NEEDS_SMTP_HOST:-}
    depends_on:
      needs-db:
        condition: service_healthy
      needs-cerbos:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-S", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/needs/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  needs-worker:
    mem_limit: 384m
    restart: unless-stopped
    image: antifragile237/cfao-needs-worker:v0.1.0
    command: ["sh", "-c", "python manage.py wait_for_schema && exec python manage.py qcluster"]
    environment: *api_env
    depends_on:
      needs-api:
        condition: service_started

  needs-gateway:
    mem_limit: 64m
    restart: unless-stopped
    image: antifragile237/cfao-needs-gateway:v0.1.2
    ports:
      - "${NEEDS_PORT:-8082}:80"
    depends_on:
      needs-api:
        condition: service_started

volumes:
  needs-kc-db-data:
  needs-db-data:
  needs-cerbos-audit:
