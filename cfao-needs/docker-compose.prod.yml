# CFAO Needs — production, derrière la passerelle commune cfao-edge.
# Toutes les images proviennent directement de votre Docker Hub (antifragile237).
# Prérequis : le PDP commun (cerbos/compose.prod.yml, projet cfao-pdp) et le
# Keycloak commun (keycloak/compose.prod.yml, projet cfao-identity) tournent, et
# cfao-edge publie needs et /auth. Puis :
#   docker compose -f docker-compose.prod.yml up -d
# Le job needs-migrate crée ou complète la base à chaque `up` (AGENTS.md §7) :
# migrations + référentiel manquant, jamais d'écrasement. S'il échoue, l'API et
# le worker ne démarrent pas : lire `docker compose logs needs-migrate`.
# Connexion : realm `cfao`, client cfao-needs-web, audience cfao-needs-api.

name: cfao-needs

services:
  needs-db:
    mem_limit: 512m
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NEEDS_DB_NAME:-needs}
      POSTGRES_USER: ${NEEDS_DB_USER:-needs}
      POSTGRES_PASSWORD: ${NEEDS_DB_PASSWORD:?NEEDS_DB_PASSWORD manquant (.env du serveur)}
    volumes:
      - needs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEEDS_DB_USER:-needs}"]
      interval: 20s
      timeout: 5s
      retries: 10

  needs-api:
    mem_limit: 512m
    restart: unless-stopped
    image: antifragile237/cfao-needs-api:v0.2.1
    environment: &api_env
      # Jamais dev en prod : dev force DEBUG (pages d'erreur détaillées, routes exposées).
      # prod : DEBUG coupé, hôtes listés (`*` refusé au démarrage).
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_ALLOWED_HOSTS: ${NEEDS_ALLOWED_HOSTS:?NEEDS_ALLOWED_HOSTS manquant (hôtes publics + needs-api)}
      NEEDS_SECRET_KEY: ${NEEDS_SECRET_KEY:?NEEDS_SECRET_KEY manquant (.env du serveur)}
      NEEDS_DEPLOYMENT_MODE: ${NEEDS_DEPLOYMENT_MODE:-standalone}
      NEEDS_DB_HOST: needs-db
      NEEDS_DB_NAME: ${NEEDS_DB_NAME:-needs}
      NEEDS_DB_USER: ${NEEDS_DB_USER:-needs}
      NEEDS_DB_PASSWORD: ${NEEDS_DB_PASSWORD:?NEEDS_DB_PASSWORD manquant (.env du serveur)}
      # PDP commun (cerbos/compose.prod.yml, projet cfao-pdp), sur cfao-maillage.
      CERBOS_HTTP: ${CERBOS_HTTP:-http://cerbos:3592}
      # Clés lues en interne, sur le réseau du Keycloak commun.
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/auth/realms/cfao/protocol/openid-connect/certs}
      # Émetteur canonique : KC_HOSTNAME du Keycloak commun + /realms/cfao.
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER manquant (ex. https://<hote>/auth/realms/cfao)}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-cfao-needs-api}
      NEEDS_CORS_ORIGINS: ${NEEDS_CORS_ORIGINS:-http://localhost:8082,http://localhost:8080,http://localhost:5174}
      # Préfixe compris (ex. https://<hôte>/besoins) : liens des mails vers le SPA.
      NEEDS_PUBLIC_BASE_URL: ${NEEDS_PUBLIC_BASE_URL:-http://localhost:8082/besoins}
      NEEDS_INTERNAL_DOMAINS: ${NEEDS_INTERNAL_DOMAINS:-cfao.com}
      NEEDS_TEAM_RECIPIENTS: ${NEEDS_TEAM_RECIPIENTS:-academy@cfao.com}
      NEEDS_EMAIL_BACKEND: ${NEEDS_EMAIL_BACKEND:-console}
      NEEDS_SMTP_HOST: ${NEEDS_SMTP_HOST:-}
      # Lecture des besoins par planning et core (en-tête X-Analytics-Key).
      NEEDS_ANALYTICS_INBOUND_KEY: ${NEEDS_ANALYTICS_INBOUND_KEY:?NEEDS_ANALYTICS_INBOUND_KEY manquant}
      # Absente = écriture du niveau de catalogue refusée.
      NEEDS_CATALOG_WRITE_INBOUND_KEY: ${NEEDS_CATALOG_WRITE_INBOUND_KEY:-}
      # Copie des besoins poussée à cfao-planning par needs-relay.
      PLANNING_API_URL: ${PLANNING_API_URL:-http://planning-api:8000}
      NEEDS_SNAPSHOT_PUSH_KEY: ${NEEDS_SNAPSHOT_PUSH_KEY:?NEEDS_SNAPSHOT_PUSH_KEY manquant}
    # cfao-maillage : lu par planning-api (GET analytics, clé partagée).
    networks: [default, identite, cfao-maillage]
    depends_on:
      needs-db:
        condition: service_healthy
      needs-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-S", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/needs/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Job ponctuel : schéma + référentiel manquant, puis sortie en 0. Même image
  # que l'API : le code qui migre est celui qui sert.
  needs-migrate:
    mem_limit: 384m
    restart: "no"
    image: antifragile237/cfao-needs-api:v0.2.1
    command: ["python", "manage.py", "bootstrap"]
    environment: *api_env
    networks: [default]
    depends_on:
      needs-db:
        condition: service_healthy

  # Même image que l'API (l'image worker dédiée n'était plus reconstruite).
  needs-worker:
    mem_limit: 384m
    # init (tini) en PID 1 : relaie SIGTERM, arrêt propre sans attendre le kill à 10 s.
    init: true
    restart: unless-stopped
    image: antifragile237/cfao-needs-api:v0.2.1
    command: ["python", "manage.py", "qcluster"]
    environment: *api_env
    depends_on:
      needs-migrate:
        condition: service_completed_successfully

  # Relais : à chaque version des besoins, pousse une copie complète à
  # cfao-planning ; reprise avec backoff si planning est arrêté.
  needs-relay:
    mem_limit: 256m
    # init (tini) en PID 1 : relaie SIGTERM, arrêt propre sans attendre le kill à 10 s.
    init: true
    restart: unless-stopped
    image: antifragile237/cfao-needs-api:v0.2.1
    command: ["python", "manage.py", "relay_needs_snapshot"]
    environment: *api_env
    networks: [default, cfao-maillage]
    depends_on:
      needs-migrate:
        condition: service_completed_successfully

  needs-gateway:
    mem_limit: 64m
    restart: unless-stopped
    image: antifragile237/cfao-needs-gateway:v0.4.0
    environment:
      # Absolu : le LAN (sans /auth) se connecte aussi sur l'émetteur public.
      NEEDS_OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER manquant}
      NEEDS_OIDC_CLIENT_ID: ${NEEDS_OIDC_CLIENT_ID:-cfao-needs-web}
    # Local par défaut : cfao-edge est la seule entrée (zrok et LAN).
    ports:
      - "${NEEDS_BIND:-127.0.0.1}:${NEEDS_PORT:-8082}:80"
    depends_on:
      needs-api:
        condition: service_started

networks:
  # Réseau de maillage inter-modules : seules les API qui s'appellent entre elles
  # le rejoignent, les bases restent sur le réseau privé de leur module.
  # Volontairement PAS `external` : le premier module démarré le crée, aucune
  # commande préalable (AGENTS.md §7). Clé et nom identiques dans chaque compose
  # (edge/tests/test_edge_config.py le vérifie).
  cfao-maillage:
    name: cfao-maillage
  # Réseau du Keycloak commun (projet compose cfao-identity), créé par lui.
  identite:
    name: ${IDENTITY_NETWORK:-cfao-identity_default}
    external: true

volumes:
  needs-db-data:
