# Ressource « needs_campaign » — la campagne elle-même et son référentiel.
#
# Lecture large : tout compte authentifié doit voir la campagne en cours, ses dates
# et ses familles de catalogue, sinon il ne peut pas savoir qu'il a une fiche à
# remplir. Écriture (ouverture, clôture, import du référentiel, arbitrage) réservée
# au pilotage Academy.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: needs_campaign
  importDerivedRoles:
    - needs_review
  rules:
    - actions: ["view", "list"]
      effect: EFFECT_ALLOW
      roles: ["*"]

    - actions: ["create", "update", "open", "close", "import", "arbitrate"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - academy_reviewer

    # Le directeur du centre seul peut arbitrer la répartition CFR / filiale.
    - actions: ["arbitrate"]
      effect: EFFECT_DENY
      roles: ["center_assistant"]
