# Ressource « needs_line » — une ligne du catalogue de campagne.
#
# C'est cette policy qui alimente le QUERY PLAN : le catalogue n'est jamais renvoyé
# en entier puis filtré côté navigateur.
#
# DÉCISION MÉTIER : le catalogue n'est PAS restreint aux marques habilitées.
# Les filiales ne déclarent pas toujours à temps les marques qu'elles exploitent ;
# masquer une marque non déclarée empêche de saisir un besoin réel, et le silence
# qui en résulte coûte plus cher qu'une marque de trop dans la liste. L'habilitation
# par marque reste portée par `principal.attr.brands` pour les usages qui en ont
# besoin, mais elle ne filtre plus la lecture du catalogue.
#
# GOTCHA : `roles` + `derivedRoles` dans la MÊME règle valent OU, pas ET.
# Pour exiger « rôle ET condition », on garde une seule dimension par règle.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: needs_line
  importDerivedRoles:
    - needs_review
  rules:
    # L'équipe Academy voit tout le catalogue — elle relit toutes les filiales.
    - actions: ["view", "list"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - academy_reviewer

    # Direction et administration : lecture complète dans leur périmètre.
    - actions: ["view", "list"]
      effect: EFFECT_ALLOW
      roles:
        - branch_admin
        - group_admin
        - branch_director
        - regional_director
        - group_director
        - branch_hr
        - group_hr

    # Saisisseurs : tout le catalogue, marques et lignes transverses.
    - actions: ["view", "list"]
      effect: EFFECT_ALLOW
      roles:
        - team_manager
        - workshop_manager
        - dps
        - dop
