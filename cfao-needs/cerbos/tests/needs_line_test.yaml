# Tests policy needs_line — lecture du catalogue de campagne.
#
# Le catalogue n'est plus filtré par marque habilitée : une filiale qui n'a pas
# déclaré à temps la marque qu'elle exploite doit quand même pouvoir saisir son
# besoin. Ce fichier verrouille cette décision — si quelqu'un remet une condition
# `brand in principal.attr.brands`, les deux premiers tests tombent.
#
# Le cas qui compte toujours : une ligne SANS marque (formation transverse au
# pôle) reste visible. La modéliser comme une pseudo-marque « TOUTES MARQUES »
# la rendrait invisible à qui n'a pas cette marque.
name: NeedsLineSuite
description: Un saisisseur voit tout le catalogue, marques et lignes transverses

principals:
  chef_toyota:
    id: u_toyota
    roles: ["workshop_manager"]
    attr:
      scopeNodes: ["groupe.cmr.douala"]
      brands: ["toyota", "peugeot"]
  chef_lovol:
    id: u_lovol
    roles: ["team_manager"]
    attr:
      scopeNodes: ["groupe.cmr.douala"]
      brands: ["lovol"]
  assistante_academy:
    id: u_assistante
    roles: ["center_assistant"]
    attr:
      scopeNodes: ["groupe"]
      brands: []
  coordonnateur:
    id: u_coord
    roles: ["training_coordinator"]
    attr:
      scopeNodes: ["groupe"]
      brands: []
  # Rôle hors périmètre : sert de garde fail-closed. Sans lui, la policy
  # pourrait devenir un allow global sans qu'aucun test ne s'en aperçoive.
  visiteur:
    id: u_visiteur
    roles: ["visitor"]
    attr:
      scopeNodes: []
      brands: []

resources:
  ligne_toyota:
    kind: needs_line
    id: l_toyota
    attr:
      brand: "toyota"
      pole: "MOBILITY"
  ligne_peugeot:
    kind: needs_line
    id: l_peugeot
    attr:
      brand: "peugeot"
      pole: "MOBILITY"
  ligne_lovol:
    kind: needs_line
    id: l_lovol
    attr:
      brand: "lovol"
      pole: "EQUIPMENT"
  ligne_transverse:
    kind: needs_line
    id: l_process
    attr:
      brand: ""
      pole: "MOBILITY"

tests:
  - name: un chef voit les lignes de ses marques
    input:
      principals: ["chef_toyota"]
      resources: ["ligne_toyota", "ligne_peugeot"]
      actions: ["view"]
    expected:
      - principal: chef_toyota
        resource: ligne_toyota
        actions:
          view: EFFECT_ALLOW
      - principal: chef_toyota
        resource: ligne_peugeot
        actions:
          view: EFFECT_ALLOW

  - name: un chef voit aussi les marques qu il ne gere pas
    input:
      principals: ["chef_toyota"]
      resources: ["ligne_lovol"]
      actions: ["view", "list"]
    expected:
      - principal: chef_toyota
        resource: ligne_lovol
        actions:
          view: EFFECT_ALLOW
          list: EFFECT_ALLOW

  - name: un chef Equipment voit les marques Motors
    input:
      principals: ["chef_lovol"]
      resources: ["ligne_peugeot", "ligne_toyota"]
      actions: ["view"]
    expected:
      - principal: chef_lovol
        resource: ligne_peugeot
        actions:
          view: EFFECT_ALLOW
      - principal: chef_lovol
        resource: ligne_toyota
        actions:
          view: EFFECT_ALLOW

  - name: une ligne transverse reste visible pour tout saisisseur
    input:
      principals: ["chef_toyota", "chef_lovol"]
      resources: ["ligne_transverse"]
      actions: ["view"]
    expected:
      - principal: chef_toyota
        resource: ligne_transverse
        actions:
          view: EFFECT_ALLOW
      - principal: chef_lovol
        resource: ligne_transverse
        actions:
          view: EFFECT_ALLOW

  - name: l equipe Academy voit tout le catalogue
    input:
      principals: ["assistante_academy"]
      resources: ["ligne_toyota", "ligne_lovol", "ligne_transverse"]
      actions: ["view", "list"]
    expected:
      - principal: assistante_academy
        resource: ligne_toyota
        actions:
          view: EFFECT_ALLOW
          list: EFFECT_ALLOW
      - principal: assistante_academy
        resource: ligne_lovol
        actions:
          view: EFFECT_ALLOW
          list: EFFECT_ALLOW
      - principal: assistante_academy
        resource: ligne_transverse
        actions:
          view: EFFECT_ALLOW
          list: EFFECT_ALLOW

  - name: le coordonnateur voit tout le catalogue
    input:
      principals: ["coordonnateur"]
      resources: ["ligne_toyota", "ligne_lovol", "ligne_transverse"]
      actions: ["view", "list"]
    expected:
      - principal: coordonnateur
        resource: ligne_toyota
        actions: { view: EFFECT_ALLOW, list: EFFECT_ALLOW }
      - principal: coordonnateur
        resource: ligne_lovol
        actions: { view: EFFECT_ALLOW, list: EFFECT_ALLOW }
      - principal: coordonnateur
        resource: ligne_transverse
        actions: { view: EFFECT_ALLOW, list: EFFECT_ALLOW }

  - name: NEGATIF un role hors perimetre ne voit rien
    input:
      principals: ["visiteur"]
      resources: ["ligne_toyota", "ligne_transverse"]
      actions: ["view", "list"]
    expected:
      - principal: visiteur
        resource: ligne_toyota
        actions:
          view: EFFECT_DENY
          list: EFFECT_DENY
      - principal: visiteur
        resource: ligne_transverse
        actions:
          view: EFFECT_DENY
          list: EFFECT_DENY
