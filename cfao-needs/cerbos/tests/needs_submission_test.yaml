# Tests policy needs_submission — la filiale saisit, l'équipe Academy valide.
# Les tests NÉGATIFS sont obligatoires (norme sécurité, skill cerbos-policy).
name: NeedsSubmissionSuite
description: Séparation stricte entre saisie (filiale) et validation (équipe Academy)

principals:
  chef_atelier_douala:
    id: u_manager
    roles: ["workshop_manager"]
    attr:
      scopeNodes: ["groupe.cmr.douala"]
      brands: ["toyota", "peugeot"]
  directeur_filiale_cmr:
    id: u_dirfil
    roles: ["branch_director"]
    attr:
      scopeNodes: ["groupe.cmr"]
      brands: []
  chef_atelier_abidjan:
    id: u_manager_civ
    roles: ["workshop_manager"]
    attr:
      scopeNodes: ["groupe.civ.abidjan"]
      brands: ["toyota"]
  assistante_academy:
    id: u_assistante
    roles: ["center_assistant"]
    attr:
      scopeNodes: ["groupe"]
      brands: []
  directeur_centre:
    id: u_dircentre
    roles: ["center_director"]
    attr:
      scopeNodes: ["groupe"]
      brands: []

resources:
  fiche_douala:
    kind: needs_submission
    id: s_douala
    attr:
      orgPath: ["groupe", "groupe.cmr", "groupe.cmr.douala"]
      status: "SUBMITTED"
  fiche_abidjan:
    kind: needs_submission
    id: s_abidjan
    attr:
      orgPath: ["groupe", "groupe.civ", "groupe.civ.abidjan"]
      status: "SUBMITTED"

tests:
  # ── positifs ───────────────────────────────────────────────────────────────
  - name: le chef d'atelier saisit et soumet la fiche de son agence
    input:
      principals: ["chef_atelier_douala"]
      resources: ["fiche_douala"]
      actions: ["view", "update", "submit"]
    expected:
      - principal: chef_atelier_douala
        actions:
          view: EFFECT_ALLOW
          update: EFFECT_ALLOW
          submit: EFFECT_ALLOW

  - name: l assistante Academy valide n importe quelle filiale
    input:
      principals: ["assistante_academy"]
      resources: ["fiche_douala", "fiche_abidjan"]
      actions: ["view", "validate", "reopen"]
    expected:
      - principal: assistante_academy
        resource: fiche_douala
        actions:
          view: EFFECT_ALLOW
          validate: EFFECT_ALLOW
          reopen: EFFECT_ALLOW
      - principal: assistante_academy
        resource: fiche_abidjan
        actions:
          view: EFFECT_ALLOW
          validate: EFFECT_ALLOW
          reopen: EFFECT_ALLOW

  - name: le directeur du centre valide aussi
    input:
      principals: ["directeur_centre"]
      resources: ["fiche_douala"]
      actions: ["validate"]
    expected:
      - principal: directeur_centre
        actions:
          validate: EFFECT_ALLOW

  - name: le directeur de filiale lit la fiche de sa filiale
    input:
      principals: ["directeur_filiale_cmr"]
      resources: ["fiche_douala"]
      actions: ["view"]
    expected:
      - principal: directeur_filiale_cmr
        actions:
          view: EFFECT_ALLOW

  # ── négatifs — le cœur de la règle ─────────────────────────────────────────
  - name: NEGATIF le directeur de filiale ne valide PAS sa propre filiale
    input:
      principals: ["directeur_filiale_cmr"]
      resources: ["fiche_douala"]
      actions: ["validate", "reopen"]
    expected:
      - principal: directeur_filiale_cmr
        actions:
          validate: EFFECT_DENY
          reopen: EFFECT_DENY

  - name: NEGATIF le chef d atelier ne valide pas sa propre fiche
    input:
      principals: ["chef_atelier_douala"]
      resources: ["fiche_douala"]
      actions: ["validate", "reopen"]
    expected:
      - principal: chef_atelier_douala
        actions:
          validate: EFFECT_DENY
          reopen: EFFECT_DENY

  - name: NEGATIF un chef d atelier ne voit pas la fiche d une autre filiale
    input:
      principals: ["chef_atelier_abidjan"]
      resources: ["fiche_douala"]
      actions: ["view", "update", "submit"]
    expected:
      - principal: chef_atelier_abidjan
        actions:
          view: EFFECT_DENY
          update: EFFECT_DENY
          submit: EFFECT_DENY
