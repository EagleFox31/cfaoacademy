# Module détachable « Identification des Besoins en Formations » (app 16).
#
# Ce fichier monte la stack COMPLÈTE, sans rien emprunter au reste du dépôt :
#   docker compose -f cfao-needs/docker-compose.yml up
#
# Sept services, aucun partagé avec la plateforme. Pour rejoindre la plateforme,
# on ne change pas ce fichier : on passe NEEDS_DEPLOYMENT_MODE=integrated et on
# pointe OIDC_* / CERBOS_HTTP vers le Keycloak et le Cerbos existants
# (docs/SPEC_RECUEIL_BESOINS_2027.md §2).

name: cfao-needs

services:
  needs-kc-db:
    # base Keycloak — mesure 54 Mio
    mem_limit: 256m
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD est obligatoire}
    volumes:
      - needs-kc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 20s
      timeout: 5s
      retries: 10

  needs-keycloak:
    # JVM bridee a 256 Mio de tas (JAVA_OPTS_KC_HEAP)
    mem_limit: 768m
    build:
      context: ./keycloak
    image: antifragile237/cfao-needs-keycloak:v0.1.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://needs-kc-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-${KC_ADMIN:-admin}}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD est obligatoire}}
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD est obligatoire}
      KC_HOSTNAME: ${NEEDS_PUBLIC_BASE_URL:-http://localhost:${NEEDS_PORT:-8080}}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      NEEDS_LAN_HOST: ${NEEDS_LAN_HOST:-}
      NEEDS_PUBLIC_BASE_URL: ${NEEDS_PUBLIC_BASE_URL:-}
      KEYCLOAK_ADDITIONAL_REDIRECT_URIS: ${KEYCLOAK_ADDITIONAL_REDIRECT_URIS:-}
      KC_HEALTH_ENABLED: "true"
      # 524 Mio mesures pour ~100 comptes : le tas par defaut de la JVM vise
      # un annuaire d'entreprise, pas un module saisonnier.
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx256m"
      # Resout les ${VAR} du realm : les mots de passe de recette restent dans
      # .env, jamais dans le fichier de realm versionne (interdit n° 2).
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.replace-placeholders=true"
      NEEDS_DEMO_PASSWORD: ${NEEDS_DEMO_PASSWORD:?NEEDS_DEMO_PASSWORD est obligatoire}
    volumes:
      # Realm en config-as-code : reproductible, dérive détectable.
      - ./keycloak:/opt/keycloak/data/import:ro
      # Theme de connexion. En start-dev le cache de themes est desactive :
      # une modification de CSS est visible au rechargement, sans redemarrage.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      needs-kc-db:
        condition: service_healthy
    ports:
      - "${KC_PORT:-8081}:8080"

  needs-cerbos:
    # PDP — mesure 51 Mio
    mem_limit: 256m
    restart: unless-stopped
    image: ghcr.io/cerbos/cerbos:0.40.0
    command: ["server", "--config=/config/cerbos.yaml"]
    environment:
      # Cerbos remonte une telemetrie anonyme par defaut. Un PDP qui emet vers
      # l'exterieur n'a pas sa place sur un reseau d'entreprise.
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - ./cerbos/policies:/policies:ro
      - ./cerbos/cerbos.yaml:/config/cerbos.yaml:ro
      # Le journal d'audit du PDP survit au redemarrage du conteneur.
      - needs-cerbos-audit:/audit
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/cerbos.yaml"]
      # 10 s -> 30 s : pics mesures jusqu'a 50 % de CPU pour une sonde.
      interval: 30s
      timeout: 5s
      retries: 10

  needs-db:
    # PostgreSQL metier — mesure 59 Mio, marge confortable
    mem_limit: 512m
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NEEDS_DB_NAME:-needs}
      POSTGRES_USER: ${NEEDS_DB_USER:-needs}
      POSTGRES_PASSWORD: ${NEEDS_DB_PASSWORD:?NEEDS_DB_PASSWORD est obligatoire}
    volumes:
      - needs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEEDS_DB_USER:-needs}"]
      interval: 20s
      timeout: 5s
      retries: 10

  needs-api:
    # 2 workers gunicorn — mesure 166 Mio a 3 workers
    mem_limit: 512m
    restart: unless-stopped
    build: ./api
    image: antifragile237/cfao-needs-api:v0.1.2
    volumes:
      - ./api:/app
    environment: &api_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Pas de valeur par défaut : le service refuse de démarrer sans secret.
      NEEDS_SECRET_KEY: ${NEEDS_SECRET_KEY:?NEEDS_SECRET_KEY est obligatoire}
      NEEDS_DEPLOYMENT_MODE: ${NEEDS_DEPLOYMENT_MODE:-standalone}
      NEEDS_DB_HOST: needs-db
      NEEDS_DB_NAME: ${NEEDS_DB_NAME:-needs}
      NEEDS_DB_USER: ${NEEDS_DB_USER:-needs}
      NEEDS_DB_PASSWORD: ${NEEDS_DB_PASSWORD:?}
      CERBOS_HTTP: http://needs-cerbos:3592
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://needs-keycloak:8080/realms/cfao-needs/protocol/openid-connect/certs}
      OIDC_ISSUER: ${OIDC_ISSUER:-${NEEDS_PUBLIC_BASE_URL:-http://localhost:8080}/realms/cfao-needs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-needs-web}
      NEEDS_CORS_ORIGINS: ${NEEDS_CORS_ORIGINS:-http://localhost:8080}
      NEEDS_PUBLIC_BASE_URL: ${NEEDS_PUBLIC_BASE_URL:-http://localhost:8080}
      NEEDS_INTERNAL_DOMAINS: ${NEEDS_INTERNAL_DOMAINS:-cfao.com}
      NEEDS_TEAM_RECIPIENTS: ${NEEDS_TEAM_RECIPIENTS:-}
      NEEDS_EMAIL_BACKEND: ${NEEDS_EMAIL_BACKEND:-console}
      NEEDS_SMTP_HOST: ${NEEDS_SMTP_HOST:-}
      # Shared key attendue par /api/v1/needs/analytics/* (appels service-to-service
      # depuis cfao-core). Absente = 401 sur tous ces endpoints.
      NEEDS_ANALYTICS_INBOUND_KEY: ${NEEDS_ANALYTICS_INBOUND_KEY:-dev-analytics-shared-secret}
    depends_on:
      needs-db:
        condition: service_healthy
      needs-cerbos:
        condition: service_started
    healthcheck:
      # Python plutot que curl : l'image n'installe aucun paquet systeme.
      # `-S` saute le chargement de site.py — mesure : la sonde faisait des pics a
      # 165 % de CPU toutes les 15 s, pour un module interne ou detecter une panne
      # 30 s plus tard ne change rien.
      test: ["CMD", "python", "-S", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/needs/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  needs-worker:
    # Django-Q — mesure 89 Mio
    mem_limit: 384m
    restart: unless-stopped
    build: ./api
    # Le worker attend le schema : les migrations sont explicites (make migrate),
    # donc la table de file peut ne pas exister au demarrage du conteneur.
    command: ["sh", "-c", "python manage.py wait_for_schema && exec python manage.py qcluster"]
    environment: *api_env
    depends_on:
      needs-api:
        condition: service_started

  needs-gateway:
    # nginx — mesure 5 Mio
    mem_limit: 64m
    restart: unless-stopped
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: antifragile237/cfao-needs-gateway:v0.1.2
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      # Fiches formation (PNG / PDF) — même arbre que la vitrine.
      - ../catalogues:/var/www/catalogues:ro
    ports:
      - "${NEEDS_PORT:-8080}:80"
    depends_on:
      needs-api:
        condition: service_started

volumes:
  needs-kc-db-data:
  needs-db-data:
  needs-cerbos-audit:
