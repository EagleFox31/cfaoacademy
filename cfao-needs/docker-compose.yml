# Module détachable « Identification des Besoins en Formations » (app 16).
#
# Ce fichier monte la stack du module ; seul le PDP Cerbos est celui de la
# plateforme (service `cerbos` du compose racine) :
#   docker compose up -d cerbos
#   docker compose -f cfao-needs/docker-compose.yml up
#
# Connexion : Keycloak commun de la recette (realm `cfao`, client `cfao-needs-web`),
# comme en prod. Il tourne dans edge/compose.dev.yml et se joint sur cfao-maillage :
#   docker compose -f edge/compose.dev.yml up -d keycloak keycloak-config edge
#
# Le SPA vit sous /besoins/ (PLAN-chemins-edge.md) : http://localhost:8082/besoins/

name: cfao-needs

services:
  # Autorisation : PDP Cerbos unique de la plateforme (service `cerbos` du
  # compose racine, port 3592 publié sur l'hôte), jamais un Cerbos de module.
  #   docker compose up -d cerbos        (à la racine, avant ce compose)

  needs-db:
    # PostgreSQL metier — mesure 59 Mio, marge confortable
    mem_limit: 512m
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NEEDS_DB_NAME:-needs}
      POSTGRES_USER: ${NEEDS_DB_USER:-needs}
      POSTGRES_PASSWORD: ${NEEDS_DB_PASSWORD:?NEEDS_DB_PASSWORD est obligatoire}
    volumes:
      - needs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEEDS_DB_USER:-needs}"]
      interval: 20s
      timeout: 5s
      retries: 10

  needs-api:
    # 2 workers gunicorn — mesure 166 Mio a 3 workers
    mem_limit: 512m
    restart: unless-stopped
    build: ./api
    image: antifragile237/cfao-needs-api:v0.1.2
    volumes:
      - ./api:/app
    environment: &api_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Pas de valeur par défaut : le service refuse de démarrer sans secret.
      NEEDS_SECRET_KEY: ${NEEDS_SECRET_KEY:?NEEDS_SECRET_KEY est obligatoire}
      NEEDS_DEPLOYMENT_MODE: ${NEEDS_DEPLOYMENT_MODE:-standalone}
      NEEDS_DB_HOST: needs-db
      NEEDS_DB_NAME: ${NEEDS_DB_NAME:-needs}
      NEEDS_DB_USER: ${NEEDS_DB_USER:-needs}
      NEEDS_DB_PASSWORD: ${NEEDS_DB_PASSWORD:?}
      CERBOS_HTTP: ${CERBOS_HTTP:-http://host.docker.internal:3592}
      # Clés lues en interne sur cfao-maillage ; émetteur = KC_HOSTNAME de la recette.
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/auth/realms/cfao/protocol/openid-connect/certs}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8088/auth/realms/cfao}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-cfao-needs-api}
      NEEDS_CORS_ORIGINS: ${NEEDS_CORS_ORIGINS:-http://localhost:8082}
      # Préfixe compris : liens des mails vers le SPA.
      NEEDS_PUBLIC_BASE_URL: ${NEEDS_PUBLIC_BASE_URL:-http://localhost:8082/besoins}
      NEEDS_INTERNAL_DOMAINS: ${NEEDS_INTERNAL_DOMAINS:-cfao.com}
      NEEDS_TEAM_RECIPIENTS: ${NEEDS_TEAM_RECIPIENTS:-}
      NEEDS_EMAIL_BACKEND: ${NEEDS_EMAIL_BACKEND:-console}
      NEEDS_SMTP_HOST: ${NEEDS_SMTP_HOST:-}
      # Shared key attendue par /api/v1/needs/analytics/* (appels service-to-service
      # depuis cfao-core). Absente = 401 sur tous ces endpoints.
      NEEDS_ANALYTICS_INBOUND_KEY: ${NEEDS_ANALYTICS_INBOUND_KEY:-dev-analytics-shared-secret}
      # Correction du niveau d'un module par cfao-planning. Absente = écriture refusée.
      NEEDS_CATALOG_WRITE_INBOUND_KEY: ${NEEDS_CATALOG_WRITE_INBOUND_KEY:-}
      # Copie des besoins poussée à cfao-planning par needs-relay (contrat
      # needs-snapshot-push). URL vide = relais inactif, planning se rattrape seul.
      PLANNING_API_URL: ${PLANNING_API_URL:-http://planning-api:8000}
      NEEDS_SNAPSHOT_PUSH_KEY: ${NEEDS_SNAPSHOT_PUSH_KEY:-dev-needs-snapshot-secret}
    # cfao-maillage : lu par planning-api (GET analytics, clé partagée).
    networks: [default, cfao-maillage]
    depends_on:
      needs-db:
        condition: service_healthy
      needs-migrate:
        condition: service_completed_successfully
    # PDP commun joint par son port publié sur l'hôte.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Python plutot que curl : l'image n'installe aucun paquet systeme.
      # `-S` saute le chargement de site.py — mesure : la sonde faisait des pics a
      # 165 % de CPU toutes les 15 s, pour un module interne ou detecter une panne
      # 30 s plus tard ne change rien.
      test: ["CMD", "python", "-S", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/needs/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Job ponctuel (AGENTS.md §7) : migrations + référentiel manquant + comptes de
  # démonstration, puis sortie en 0. Rejouable : sur une base à jour, zéro écriture.
  needs-migrate:
    mem_limit: 384m
    restart: "no"
    build: ./api
    volumes:
      - ./api:/app
    command: ["python", "manage.py", "bootstrap", "--demo"]
    environment: *api_env
    depends_on:
      needs-db:
        condition: service_healthy

  needs-worker:
    # Django-Q — mesure 89 Mio
    mem_limit: 384m
    restart: unless-stopped
    build: ./api
    # Même image que l'API : sans root (uid 10001).
    image: antifragile237/cfao-needs-api:v0.1.2
    # Le schéma est en place : le worker attend la fin du job needs-migrate.
    command: ["python", "manage.py", "qcluster"]
    environment: *api_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      needs-migrate:
        condition: service_completed_successfully

  # Relais de l'outbox : à chaque version des besoins (trigger + NOTIFY), pousse
  # une copie complète à cfao-planning ; reprise avec backoff si planning est arrêté.
  needs-relay:
    mem_limit: 256m
    restart: unless-stopped
    build: ./api
    # Même image que l'API : sans root (uid 10001).
    image: antifragile237/cfao-needs-api:v0.1.2
    volumes:
      - ./api:/app
    command: ["python", "manage.py", "relay_needs_snapshot"]
    environment: *api_env
    networks: [default, cfao-maillage]
    depends_on:
      needs-migrate:
        condition: service_completed_successfully

  needs-gateway:
    # nginx — mesure 5 Mio
    mem_limit: 64m
    restart: unless-stopped
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: antifragile237/cfao-needs-gateway:v0.4.0
    environment:
      # Émetteur commun, le même que celui que l'API vérifie.
      NEEDS_OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8088/auth/realms/cfao}
      NEEDS_OIDC_CLIENT_ID: ${NEEDS_OIDC_CLIENT_ID:-cfao-needs-web}
    volumes:
      - ./web/dist:/usr/share/nginx/html/besoins:ro
      # Fiches formation (PNG / PDF) — même arbre que la vitrine.
      - ../catalogues:/var/www/catalogues:ro
    ports:
      - "${NEEDS_PORT:-8082}:80"
    depends_on:
      needs-api:
        condition: service_started

networks:
  # Réseau de maillage inter-modules : seules les API qui s'appellent entre elles
  # le rejoignent, les bases restent sur le réseau privé de leur module.
  # Volontairement PAS `external` : le premier module démarré le crée, aucune
  # commande préalable (AGENTS.md §7). Clé et nom identiques dans chaque compose
  # (edge/tests/test_edge_config.py le vérifie).
  cfao-maillage:
    name: cfao-maillage

volumes:
  needs-db-data:
