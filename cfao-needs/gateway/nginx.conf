# Passerelle du module — sert la SPA et route l'API. La connexion passe par le
# Keycloak commun (realm `cfao`), publié sous /auth par la passerelle cfao-edge.
#
# En R0 le BFF (oauth2-proxy) n'est pas encore devant : le SPA porte le flow OIDC
# public (PKCE). Le passage au cookie httpOnly est prévu R1 — il ne change que
# cette configuration, pas le code applicatif.

# Détermination sécurisée du schéma, host et port réels (écrasement anti-spoofing)
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Extraction du port depuis le Host client ($http_host) si présent, sinon selon le schéma
map $http_host $host_port {
    "~^[^\:]+:(?<p>\d+)$" $p;
    default               $default_port;
}

map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    ""      $host_port;
}

map $forwarded_proto $default_port {
    https   443;
    default 80;
}

server {
    listen 80;
    server_name _;

    # Le navigateur ne doit jamais voir la stack technique.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;   # aligné sur NEEDS_IMPORT_MAX_FILE_MB

    # Configuration OIDC du déploiement (entrypoint.d/15-config-oidc.sh).
    # `expires` plutôt qu'add_header : les en-têtes du server restent hérités.
    location = /config.js {
        alias /etc/nginx/needs-config.js;
        expires -1;
    }

    location /api/v1/needs/ {
        proxy_pass http://needs-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_read_timeout 120s;   # les imports prennent du temps
    }

    # Fiches PNG / PDF — partagées avec la vitrine (volume monté depuis le repo).
    # Pas de X-Frame-Options DENY ici : le viewer SPA les embarque en iframe.
    location /catalogues/ {
        alias /var/www/catalogues/;
        types {
            image/png png;
            application/pdf pdf;
            image/jpeg jpg jpeg;
            image/webp webp;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        # Pas de try_files avec alias (comportement nginx fragile).
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
