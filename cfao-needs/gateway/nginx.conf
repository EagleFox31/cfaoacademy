# Passerelle du module — sert la SPA et route l'API. La connexion passe par le
# Keycloak commun (realm `cfao`), publié sous /auth par la passerelle cfao-edge.
#
# En R0 le BFF (oauth2-proxy) n'est pas encore devant : le SPA porte le flow OIDC
# public (PKCE). Le passage au cookie httpOnly est prévu R1 — il ne change que
# cette configuration, pas le code applicatif.

# Détermination sécurisée du schéma, host et port réels (écrasement anti-spoofing)
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Extraction du port depuis le Host client ($http_host) si présent, sinon selon le schéma
map $http_host $host_port {
    "~^[^\:]+:(?<p>\d+)$" $p;
    default               $default_port;
}

map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    ""      $host_port;
}

map $forwarded_proto $default_port {
    https   443;
    default 80;
}

server {
    listen 80;
    server_name _;

    # Le navigateur ne doit jamais voir la stack technique.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;   # aligné sur NEEDS_IMPORT_MAX_FILE_MB

    # Redirections relatives : derrière edge, l'hôte et le port vus par le
    # navigateur ne sont pas ceux de ce conteneur.
    absolute_redirect off;

    # Une adresse, applications par chemin (PLAN-chemins-edge.md) : le SPA vit
    # sous /besoins/ de bout en bout, aucun proxy ne retire ce préfixe.

    # Configuration OIDC du déploiement (entrypoint.d/15-config-oidc.sh).
    # `expires` plutôt qu'add_header : les en-têtes du server restent hérités.
    location = /besoins/config.js {
        alias /etc/nginx/needs-config.js;
        expires -1;
    }

    location /api/v1/needs/ {
        proxy_pass http://needs-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_read_timeout 120s;   # les imports prennent du temps
    }

    # Fiches PNG / PDF — partagées avec la vitrine (volume monté depuis le repo).
    # Pas de X-Frame-Options DENY ici : le viewer SPA les embarque en iframe.
    location /besoins/catalogues/ {
        alias /var/www/catalogues/;
        types {
            image/png png;
            application/pdf pdf;
            image/jpeg jpg jpeg;
            image/webp webp;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        # Pas de try_files avec alias (comportement nginx fragile).
    }

    location /besoins/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /besoins/index.html;
    }

    # index.html jamais en cache : il désigne les fichiers du build en service,
    # un ancien index garderait des liens vers des fichiers disparus (page blanche).
    location = /besoins/index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location = /besoins {
        return 308 /besoins/;
    }

    # Ancien bundle servi à la racine (avant v0.4.0) resté dans le cache du navigateur :
    # ses /assets/index-*.js n'existent plus. Au lieu de l'index en text/html (script
    # refusé, page blanche), on renvoie un script qui recharge l'application sous /besoins/.
    location ~ ^/assets/[^/]+\.js$ {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 200 "window.location.replace('/besoins/' + window.location.search);\n";
    }

    # Anciens liens à la racine (/relecture, /marque/…, /fiche/…) : même route sous /besoins.
    # 307 non mis en cache (pas 308) : après L2, la racine de l'origine sert la landing,
    # un navigateur ne doit pas garder « / → /besoins/ » en mémoire.
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 307 /besoins$request_uri;
    }
}
