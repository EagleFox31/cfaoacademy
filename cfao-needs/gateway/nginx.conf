# Passerelle du module — sert la SPA et route l'API.
#
# En R0 le BFF (oauth2-proxy) n'est pas encore devant : le SPA porte le flow OIDC
# public (PKCE). Le passage au cookie httpOnly est prévu R1 — il ne change que
# cette configuration, pas le code applicatif.
server {
    listen 80;
    server_name _;

    # Le navigateur ne doit jamais voir la stack technique.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;   # aligné sur NEEDS_IMPORT_MAX_FILE_MB

    location /api/v1/needs/ {
        proxy_pass http://needs-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # les imports prennent du temps
    }

    # Fiches PNG / PDF — partagées avec la vitrine (volume monté depuis le repo).
    # Pas de X-Frame-Options DENY ici : le viewer SPA les embarque en iframe.
    location /catalogues/ {
        alias /var/www/catalogues/;
        types {
            image/png png;
            application/pdf pdf;
            image/jpeg jpg jpeg;
            image/webp webp;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        # Pas de try_files avec alias (comportement nginx fragile).
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
