# ── Client scope : claims de périmètre 3D (scopeNode / departments / brands / orgPath) ──
# Permet la stratégie « claims dans le token » (architecture.md §6). La résolution
# côté service reste possible en parallèle ; ces claims alimentent le principal Cerbos.
clientScopes:
  - name: cfao-scope
    description: Périmètre 3D CFAO (org × département × marque)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: scopeNode
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: scopeNode
          claim.name: scopeNode
          jsonType.label: String
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
      - name: departments
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: departments
          claim.name: departments
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
      - name: brands
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: brands
          claim.name: brands
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
      - name: orgPath
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: orgPath
          claim.name: orgPath
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  # ── Audiences : un scope par API. Le client qui appelle une API le porte en
  # scope par défaut ; l'API n'accepte que les jetons dont `aud` la nomme.
  - name: aud-cfao-core-api
    description: Audience de l'API cfao-core
    protocol: openid-connect
    attributes: { include.in.token.scope: "false", display.on.consent.screen: "false" }
    protocolMappers:
      - name: aud-cfao-core-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config: { included.client.audience: cfao-core-api, access.token.claim: "true", id.token.claim: "false", introspection.token.claim: "true" }
  - name: aud-cfao-needs-api
    description: Audience de l'API cfao-needs
    protocol: openid-connect
    attributes: { include.in.token.scope: "false", display.on.consent.screen: "false" }
    protocolMappers:
      - name: aud-cfao-needs-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config: { included.client.audience: cfao-needs-api, access.token.claim: "true", id.token.claim: "false", introspection.token.claim: "true" }
  - name: aud-cfao-cr-api
    description: Audience de l'API des comptes rendus
    protocol: openid-connect
    attributes: { include.in.token.scope: "false", display.on.consent.screen: "false" }
    protocolMappers:
      - name: aud-cfao-cr-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config: { included.client.audience: cfao-cr-api, access.token.claim: "true", id.token.claim: "false", introspection.token.claim: "true" }
  - name: aud-cfao-planning-api
    description: Audience de l'API cfao-planning
    protocol: openid-connect
    attributes: { include.in.token.scope: "false", display.on.consent.screen: "false" }
    protocolMappers:
      - name: aud-cfao-planning-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config: { included.client.audience: cfao-planning-api, access.token.claim: "true", id.token.claim: "false", introspection.token.claim: "true" }
  - name: aud-cfao-operations-api
    description: Audience de l'API cfao-operations (Node)
    protocol: openid-connect
    attributes: { include.in.token.scope: "false", display.on.consent.screen: "false" }
    protocolMappers:
      - name: aud-cfao-operations-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config: { included.client.audience: cfao-operations-api, access.token.claim: "true", id.token.claim: "false", introspection.token.claim: "true" }

# ── Clients OAuth ──
# Convention : cfao-<module>-web (interface qui obtient le jeton) et
# cfao-<module>-api (API qui le vérifie : bearer-only, aucun flux, sert de cible d'audience).
# Le portail (BFF) et la SPA de dev servent core, comptes rendus, planning et operations.
clients:
  # BFF (oauth2-proxy) — confidentiel. La SPA passe par lui ; elle ne voit jamais le JWT.
  - clientId: cfao-portal
    name: CFAO Academy — Portail (BFF)
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    secret: "$(env:CFAO_PORTAL_SECRET:-dev-portal-secret)"  # défaut = dev ; prod via Key Vault
    redirectUris:
      - "http://localhost:8000/oauth2/callback"
    webOrigins:
      - "http://localhost:8000"
    defaultClientScopes:
      - basic
      - web-origins
      - profile
      - roles
      - email
      - cfao-scope
      - aud-cfao-core-api
      - aud-cfao-cr-api
      - aud-cfao-planning-api
      - aud-cfao-operations-api

  # SPA dev (PKCE public) — pour obtenir un token côté dev et tester /me sans le BFF complet.
  # Désactivée en prod (CFAO_SPA_ENABLED=false) : grant password et redirections larges.
  - clientId: cfao-spa
    name: CFAO Academy — SPA (dev, PKCE)
    enabled: $(env:CFAO_SPA_ENABLED:-true)
    protocol: openid-connect
    publicClient: true
    standardFlowEnabled: true
    directAccessGrantsEnabled: true
    redirectUris:
      - "http://localhost:5173/*"
      - "http://localhost:8000/*"
      - "http://192.168.1.126:5173/*"
      - "http://192.168.1.126:8000/*"
      - "http://192.168.*:5173/*"
      - "http://192.168.*:8000/*"
    webOrigins:
      - "+"
    attributes:
      pkce.code.challenge.method: S256
    defaultClientScopes:
      - basic
      - web-origins
      - profile
      - roles
      - email
      - cfao-scope
      - aud-cfao-core-api
      - aud-cfao-cr-api
      - aud-cfao-planning-api
      - aud-cfao-operations-api

  # SPA needs (PKCE public), successeur de `needs-web` du realm cfao-needs.
  - clientId: cfao-needs-web
    name: CFAO Needs — SPA (PKCE)
    enabled: true
    protocol: openid-connect
    publicClient: true
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    redirectUris:
      - "http://localhost:8082/*"
      - "http://localhost:5174/*"
      - "http://127.0.0.1:8082/*"
    webOrigins:
      - "+"
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes:
      - basic
      - web-origins
      - profile
      - roles
      - email
      - cfao-scope
      - aud-cfao-needs-api

  # APIs : bearer-only. Aucun flux, aucun secret : elles ne demandent jamais de jeton.
  - clientId: cfao-core-api
    name: CFAO Academy — API core
    enabled: true
    protocol: openid-connect
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
  - clientId: cfao-needs-api
    name: CFAO Needs — API
    enabled: true
    protocol: openid-connect
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
  - clientId: cfao-cr-api
    name: CFAO Comptes rendus — API
    enabled: true
    protocol: openid-connect
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
  - clientId: cfao-planning-api
    name: CFAO Planning — API
    enabled: true
    protocol: openid-connect
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
  - clientId: cfao-operations-api
    name: CFAO Operations — API
    enabled: true
    protocol: openid-connect
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false

# ── Identity providers upstream (MS / Google) — désactivés tant que les secrets ne sont pas fournis ──
identityProviders:
  - alias: google
    providerId: google
    enabled: false
    trustEmail: true
    config:
      clientId: "set-in-prod"
      clientSecret: "set-in-prod"
      defaultScope: "openid email profile"
  - alias: microsoft
    providerId: oidc
    enabled: false
    trustEmail: true
    config:
      clientId: "set-in-prod"
      clientSecret: "set-in-prod"
      authorizationUrl: "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
      tokenUrl: "https://login.microsoftonline.com/common/oauth2/v2.0/token"
      defaultScope: "openid email profile"

