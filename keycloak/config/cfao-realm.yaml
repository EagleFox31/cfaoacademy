# ── Client scope : claims de périmètre 3D (scopeNode / departments / brands / orgPath) ──
# Permet la stratégie « claims dans le token » (architecture.md §6). La résolution
# côté service reste possible en parallèle ; ces claims alimentent le principal Cerbos.
clientScopes:
  - name: cfao-scope
    description: Périmètre 3D CFAO (org × département × marque)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: scopeNode
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: scopeNode
          claim.name: scopeNode
          jsonType.label: String
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
      - name: departments
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: departments
          claim.name: departments
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
      - name: brands
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: brands
          claim.name: brands
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
      - name: orgPath
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: orgPath
          claim.name: orgPath
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

# ── Clients OAuth ──
clients:
  # BFF (oauth2-proxy) — confidentiel. La SPA passe par lui ; elle ne voit jamais le JWT.
  - clientId: cfao-portal
    name: CFAO Academy — Portail (BFF)
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    secret: "dev-portal-secret"  # DEV uniquement — prod via Key Vault
    redirectUris:
      - "http://localhost:8000/oauth2/callback"
    webOrigins:
      - "http://localhost:8000"
    defaultClientScopes:
      - basic
      - web-origins
      - profile
      - roles
      - email
      - cfao-scope

  # SPA dev (PKCE public) — pour obtenir un token côté dev et tester /me sans le BFF complet.
  - clientId: cfao-spa
    name: CFAO Academy — SPA (dev, PKCE)
    enabled: true
    protocol: openid-connect
    publicClient: true
    standardFlowEnabled: true
    directAccessGrantsEnabled: true
    redirectUris:
      - "http://localhost:5173/*"
      - "http://localhost:8000/*"
      - "http://192.168.1.126:5173/*"
      - "http://192.168.1.126:8000/*"
      - "http://192.168.*:5173/*"
      - "http://192.168.*:8000/*"
    webOrigins:
      - "+"
    attributes:
      pkce.code.challenge.method: S256
    defaultClientScopes:
      - basic
      - web-origins
      - profile
      - roles
      - email
      - cfao-scope

# ── Identity providers upstream (MS / Google) — désactivés tant que les secrets ne sont pas fournis ──
identityProviders:
  - alias: google
    providerId: google
    enabled: false
    trustEmail: true
    config:
      clientId: "set-in-prod"
      clientSecret: "set-in-prod"
      defaultScope: "openid email profile"
  - alias: microsoft
    providerId: oidc
    enabled: false
    trustEmail: true
    config:
      clientId: "set-in-prod"
      clientSecret: "set-in-prod"
      authorizationUrl: "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
      tokenUrl: "https://login.microsoftonline.com/common/oauth2/v2.0/token"
      defaultScope: "openid email profile"

