# Realm CFAO Academy — config-as-code (story 00-6).
# Appliqué par keycloak-config-cli (idempotent, sans redémarrage, détection de dérive).
# DEV : valeurs littérales non sensibles ci-dessous (secret BFF de dev, IdP placeholders).
# PROD : remplacer ces littéraux par l'injection de secrets de l'environnement (Azure Key Vault).
realm: cfao
enabled: true
displayName: CFAO Academy
sslRequired: external
registrationAllowed: false
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
resetPasswordAllowed: true
# ── Durées de session (Phase 3 — Auth & Sessions) ──
# JWT court : 15 minutes. La continuité est assurée par le Silent Refresh côté SPA.
accessTokenLifespan: 900
# SSO Session standard (journée de travail) :
ssoSessionIdleTimeout: 28800          # 8 heures
ssoSessionMaxLifespan: 86400          # 24 heures
# "Se souvenir de moi" natif Keycloak (postes personnels, pas les ateliers) :
rememberMe: true
ssoSessionIdleTimeoutRememberMe: 604800   # 7 jours
ssoSessionMaxLifespanRememberMe: 604800   # 7 jours
# Client session alignée sur la session SSO :
clientSessionIdleTimeout: 28800
clientSessionMaxLifespan: 86400
loginTheme: cfao-academy
internationalizationEnabled: true
supportedLocales:
  - fr
  - en
  - pt
defaultLocale: fr


# User profile : déclare les attributs de périmètre 3D pour qu'ils soient acceptés
# (KC 24+ rejette les attributs non déclarés). unmanagedAttributePolicy ENABLED en filet.
components:
  org.keycloak.userprofile.UserProfileProvider:
    - name: declarative-user-profile
      providerId: declarative-user-profile
      config:
        kc.user.profile.config:
          - '{"attributes":[{"name":"username","permissions":{"view":["admin","user"],"edit":["admin","user"]}},{"name":"email","permissions":{"view":["admin","user"],"edit":["admin","user"]}},{"name":"scopeNode","permissions":{"view":["admin","user"],"edit":["admin"]}},{"name":"departments","multivalued":true,"permissions":{"view":["admin","user"],"edit":["admin"]}},{"name":"brands","multivalued":true,"permissions":{"view":["admin","user"],"edit":["admin"]}},{"name":"orgPath","multivalued":true,"permissions":{"view":["admin","user"],"edit":["admin"]}}],"unmanagedAttributePolicy":"ENABLED"}'

