# Smoke de l'extension cfao-hub : l'image Keycloak de prod + le hub cfao-academy-mail,
# isolés (projet à part, ports 18090). Les mails partent sur la console du worker.
#   export SMOKE_FERNET_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
#   f=keycloak/tests/compose.hub.smoke.yml
#   docker compose -f $f up -d --build --wait keycloak mail-api mail-worker
#   docker compose -f $f run --rm config
#   KC_URL=http://localhost:18090/auth SMOKE_COMPOSE=$f pytest -q keycloak/tests/smoke_hub_mail.py
#   docker compose -f $f down -v
name: cfao-hub-smoke

x-hub-env: &hub_env
  MAIL_SECRET_KEY: smoke-secret
  MAIL_INBOUND_KEY: smoke-shared-key
  MAIL_INBOUND_KEYS: cfao-identity=smoke-identity-key
  MAIL_SEALED_CONTEXT_KEY: ${SMOKE_FERNET_KEY:?SMOKE_FERNET_KEY manquante}
  MAIL_EMAIL_BACKEND: console
  MAIL_INTERNAL_DOMAINS: cfao.example
  # Lien http://localhost : DEBUG accepte http, la liste n'admet que localhost.
  DJANGO_DEBUG: "true"
  MAIL_ALLOWED_LINK_HOSTS: localhost
  MAIL_DB_HOST: mail-db
  MAIL_DB_NAME: cfao_mail
  MAIL_DB_USER: cfao_mail
  MAIL_DB_PASSWORD: smoke-db

services:
  keycloak-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: keycloak, POSTGRES_USER: keycloak, POSTGRES_PASSWORD: keycloak }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U keycloak"], interval: 5s, timeout: 5s, retries: 20 }

  keycloak:
    build: ..
    image: cfao-keycloak:hub-smoke
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:18090/auth
      KC_HTTP_ENABLED: "true"
      KC_SPI_EMAIL_TEMPLATE__CFAO_HUB__URL: http://mail-api:5180
      KC_SPI_EMAIL_TEMPLATE__CFAO_HUB__SERVICE_KEY: smoke-identity-key
      KC_SPI_AUTHENTICATOR__CFAO_PASSWORD_OR_EMAIL_FORM__SUPPORT_EMAIL: support@cfao.example
      KC_SPI_AUTHENTICATOR__CFAO_PASSWORD_OR_EMAIL_FORM__CODE_PEPPER: smoke-pepper-0123456789abcdef0123456789
    ports: ["127.0.0.1:18090:8080"]
    depends_on: { keycloak-db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  config:
    image: cfao-keycloak:hub-smoke
    entrypoint: ["java", "-jar", "/opt/cfao-config-cli/keycloak-config-cli.jar"]
    command: []
    depends_on: { keycloak: { condition: service_healthy } }
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /opt/cfao-realm/*.yaml,/fixtures/*.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      CFAO_PORTAL_SECRET: smoke-portal-secret
      CFAO_SUPERVISION_COLLECTOR_SECRET: smoke-supervision-collector-secret
      CFAO_SPA_ENABLED: "false"
    volumes: ["./fixtures:/fixtures:ro"]

  mail-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: cfao_mail, POSTGRES_USER: cfao_mail, POSTGRES_PASSWORD: smoke-db }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cfao_mail"], interval: 5s, timeout: 5s, retries: 20 }

  mail-migrate:
    build: ../../cfao-academy-mail
    image: cfao-academy-mail:hub-smoke
    environment: *hub_env
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_email_templates && python manage.py ensure_mail_schedules"]
    restart: "no"
    depends_on: { mail-db: { condition: service_healthy } }

  mail-api:
    build: ../../cfao-academy-mail
    image: cfao-academy-mail:hub-smoke
    environment: *hub_env
    depends_on:
      mail-db: { condition: service_healthy }
      mail-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5180/api/v1/mail/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail-worker:
    build: ../../cfao-academy-mail
    image: cfao-academy-mail:hub-smoke
    environment: *hub_env
    command: ["python", "manage.py", "qcluster"]
    depends_on:
      mail-migrate: { condition: service_completed_successfully }
      mail-api: { condition: service_healthy }
