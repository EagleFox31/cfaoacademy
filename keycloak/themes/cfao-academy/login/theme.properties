# Thème de connexion du module — hérite du thème Keycloak, ne le remplace pas.
#
# `styles` ECRASE la valeur du parent : reprendre css/login.css est obligatoire,
# sinon la mise en page PatternFly disparaît et il ne reste que nos surcharges.
# `stylesCommon` (PatternFly) est hérité tel quel, on n'y touche pas.
parent=keycloak
import=common/keycloak

styles=css/login.css css/cfao.css
scripts=js/login.js

