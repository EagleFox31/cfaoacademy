# Keycloak commun (realm `cfao`) en production : /srv/apps/cfao-identity.
# Deux services permanents (Keycloak, sa base) et un job ponctuel (config),
# relance a chaque `up` (AGENTS.md section 7) :
#   docker compose --env-file .env -f compose.prod.yml up -d
# Aucun secret par défaut : une variable manquante bloque le démarrage.
name: cfao-identity

services:
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD manquant}
    volumes: [keycloak-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: antifragile237/cfao-keycloak:${KC_VERSION:?KC_VERSION manquant}
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD manquant}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD manquant}
      # URL publique canonique : seule source de l'émetteur (`iss`), jamais déduite
      # du Host reçu (empoisonnement des liens). Elle se termine par /auth : l'image
      # est servie sous ce chemin et aucun proxy ne réécrit le préfixe. Les modules
      # joignent Keycloak en interne (http://<interne>:8080/auth) : backchannel
      # dynamique. Changer d'hôte : voir .env.prod.example, sans rupture.
      KC_HOSTNAME: ${KC_HOSTNAME:?KC_HOSTNAME manquant}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Console d'administration hors de l'URL publique (404 à la passerelle).
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:?KC_HOSTNAME_ADMIN manquant}
      # HTTP en LAN (le realm exige TLS hors réseau privé : sslRequired external).
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
      # Mails d'action et connexion par code par le hub cfao-academy-mail. URL vide =
      # extension inactive (mails SMTP de Keycloak, pas de connexion par code).
      KC_SPI_EMAIL_TEMPLATE__CFAO_HUB__URL: ${CFAO_HUB_URL:-}
      KC_SPI_EMAIL_TEMPLATE__CFAO_HUB__SERVICE_KEY: ${CFAO_IDENTITY_MAIL_KEY:-}
      # Poivre des codes (>= 32 caractères), obligatoire : un poivre tiré au hasard
      # à chaque démarrage invaliderait les codes en cours.
      KC_SPI_AUTHENTICATOR__CFAO_PASSWORD_OR_EMAIL_FORM__CODE_PEPPER: ${CFAO_LOGIN_CODE_PEPPER:?CFAO_LOGIN_CODE_PEPPER manquant}
      # Destinataire des alertes « adresse inconnue » ; vide = pas d'alerte.
      KC_SPI_AUTHENTICATOR__CFAO_PASSWORD_OR_EMAIL_FORM__SUPPORT_EMAIL: ${CFAO_LOGIN_SUPPORT_EMAIL:-}
      # Lien « Accueil » de la page de connexion = la landing d'Academy ;
      # vide = accueil de l'application qui demande la connexion.
      CFAO_LANDING_URL: ${CFAO_LANDING_URL:-}
    depends_on:
      keycloak-db: { condition: service_healthy }
    # Local par défaut : la passerelle (réseau hôte) et la migration y passent.
    ports: ["${KC_BIND:-127.0.0.1}:${KC_PORT:-8083}:8080"]
    healthcheck:
      # Port de gestion (9000) : /health/ready, sans curl dans l'image.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Job : applique le realm embarqué dans l'image, puis sort. Idempotent : la
  # somme de contrôle du fichier importé est gardée dans le realm, un rejeu avec
  # la même image ne touche à rien ; seule une nouvelle image réapplique le realm.
  config:
    image: antifragile237/cfao-keycloak:${KC_VERSION:?KC_VERSION manquant}
    restart: "no"
    entrypoint: ["java", "-jar", "/opt/cfao-config-cli/keycloak-config-cli.jar"]
    command: []
    depends_on:
      keycloak: { condition: service_healthy }
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_USER: ${KC_ADMIN:-admin}
      KEYCLOAK_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD manquant}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: ${KC_IMPORT_LOCATIONS:-/opt/cfao-realm/*.yaml}
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_CACHE_ENABLED: "true"
      CFAO_PORTAL_SECRET: ${CFAO_PORTAL_SECRET:?CFAO_PORTAL_SECRET manquant}
      CFAO_SUPERVISION_COLLECTOR_SECRET: ${CFAO_SUPERVISION_COLLECTOR_SECRET:?CFAO_SUPERVISION_COLLECTOR_SECRET manquant}
      CFAO_SPA_ENABLED: "false"
      CFAO_PORTAL_REDIRECT_URIS: ${CFAO_PORTAL_REDIRECT_URIS:?CFAO_PORTAL_REDIRECT_URIS manquant}
      CFAO_NEEDS_REDIRECT_URIS: ${CFAO_NEEDS_REDIRECT_URIS:?CFAO_NEEDS_REDIRECT_URIS manquant}
      CFAO_PORTAIL_WEB_REDIRECT_URIS: ${CFAO_PORTAIL_WEB_REDIRECT_URIS:?CFAO_PORTAIL_WEB_REDIRECT_URIS manquant}

volumes:
  keycloak-db-data:
