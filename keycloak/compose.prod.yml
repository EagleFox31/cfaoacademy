# Keycloak commun (realm `cfao`) en production : /srv/apps/cfao-identity.
# Deux services permanents (Keycloak, sa base) et un job ponctuel (config).
#   docker compose --env-file .env -f compose.prod.yml up -d keycloak
#   docker compose --env-file .env -f compose.prod.yml run --rm config
# Aucun secret par défaut : une variable manquante bloque le démarrage.
name: cfao-identity

services:
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD manquant}
    volumes: [keycloak-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: antifragile237/cfao-keycloak:${KC_VERSION:?KC_VERSION manquant}
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD manquant}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD manquant}
      # URL publique : fixe l'émetteur des jetons (`iss`) vu par les modules.
      KC_HOSTNAME: ${KC_HOSTNAME:?KC_HOSTNAME manquant}
      # HTTP en LAN (le realm exige TLS hors réseau privé : sslRequired external).
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
    depends_on:
      keycloak-db: { condition: service_healthy }
    ports: ["${KC_PORT:-8083}:8080"]
    healthcheck:
      # Port de gestion (9000) : /health/ready, sans curl dans l'image.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Job : applique le realm embarqué dans l'image, puis sort. Idempotent.
  config:
    image: antifragile237/cfao-keycloak:${KC_VERSION:?KC_VERSION manquant}
    profiles: [config]
    restart: "no"
    entrypoint: ["java", "-jar", "/opt/cfao-config-cli/keycloak-config-cli.jar"]
    command: []
    depends_on:
      keycloak: { condition: service_healthy }
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KC_ADMIN:-admin}
      KEYCLOAK_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD manquant}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: ${KC_IMPORT_LOCATIONS:-/opt/cfao-realm/*.yaml}
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      CFAO_PORTAL_SECRET: ${CFAO_PORTAL_SECRET:?CFAO_PORTAL_SECRET manquant}
      CFAO_SPA_ENABLED: "false"

volumes:
  keycloak-db-data:
