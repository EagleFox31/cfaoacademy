# CFAO Academy — Nœud A (Infra + CI)
# Socle plateforme : Keycloak (authN) · Cerbos (authZ) · core (Django) · operations (Node)
# · 2× Postgres · gateway (nginx) + oauth2-proxy (BFF). Voir architecture.md §7.
#
# Hygiène DevOps : chaque service est borné (CPU + mémoire), a une politique de redémarrage
# et un healthcheck quand c'est fiable. Les bornes sont PARAMÉTRABLES par variables
# (CPU_* / MEM_*) — défauts calibrés dev. Par environnement : surcharger via .env ou un
# fichier d'override. En prod (Azure Container Apps), le dimensionnement vit dans l'IaC, pas ici.
services:
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes: [keycloak-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${CPU_KEYCLOAK_DB:-0.40}"
          memory: "${MEM_KEYCLOAK_DB:-256M}"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Borne la JVM sous la limite mémoire du conteneur (évite l'OOM kill).
      # G1GC + limites explicites pour éviter le GC thrashing après plusieurs heures.
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "${CPU_KEYCLOAK:-1.0}"
          memory: "${MEM_KEYCLOAK:-1280M}"
        reservations:
          memory: "${MEM_KEYCLOAK_RES:-640M}"

  # Story 00-6 : applique le realm en config-as-code (idempotent, sans redémarrage).
  # Job one-shot : attend Keycloak, importe ./keycloak/config/*.yaml, puis sort (exit 0).
  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:latest-25.0.1  # épinglé sur le build KC 25
    restart: on-failure  # one-shot : retente si erreur, s'arrête au succès
    depends_on:
      keycloak: { condition: service_started }
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/*.yaml
      # Substitution désactivée : le realm dev porte des valeurs littérales non sensibles.
      # En prod, les secrets (client BFF, IdP) sont injectés au déploiement via Key Vault.
      IMPORT_VARSUBSTITUTION_ENABLED: "false"
    volumes:
      - ./keycloak/config:/config:ro
    deploy:
      resources:
        limits:
          cpus: "${CPU_KCCONFIG:-0.50}"
          memory: "${MEM_KCCONFIG:-512M}"

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.40.0
    command: ["server", "--config=/config/config.yaml"]
    restart: unless-stopped
    ports: ["3592:3592", "3593:3593"]
    volumes:
      - ./cerbos/config.yaml:/config/config.yaml:ro
      - ./cerbos/policies:/policies:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--insecure"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${CPU_CERBOS:-0.50}"
          memory: "${MEM_CERBOS:-192M}"

  core-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CORE_DB_NAME:-core}
      POSTGRES_USER: ${CORE_DB_USER:-core}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-core}
    volumes: [core-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USER:-core}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${CPU_CORE_DB:-0.40}"
          memory: "${MEM_CORE_DB:-256M}"

  core:
    build: ./cfao-core
    restart: unless-stopped
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      CORE_DB_HOST: core-db
      CERBOS_HTTP: http://cerbos:3592
      OIDC_REALM: ${OIDC_REALM:-cfao}
      OIDC_JWKS_URL: http://keycloak:8080/realms/${OIDC_REALM:-cfao}/protocol/openid-connect/certs
      OIDC_ISSUER: http://keycloak:8080/realms/${OIDC_REALM:-cfao}
      # Dev uniquement : permet au seed de récupérer les vrais `sub` via l'API admin Keycloak.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      MEDACAP_MONGO_URI: ${MEDACAP_MONGO_URI:-mongodb://mongodb:27017/academy}
      MEDACAP_MONGO_DB: ${MEDACAP_MONGO_DB:-academy}
      # cfao-needs — appel HTTP service-to-service via le réseau externe
      # `cfao-needs_default` (voir bas de fichier). Le service `needs-api`
      # y est résolu par DNS docker.
      NEEDS_API_URL: ${NEEDS_API_URL:-http://needs-api:8000}
      NEEDS_ANALYTICS_KEY: ${NEEDS_ANALYTICS_KEY:-dev-analytics-shared-secret}
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    networks:
      - default
      - cfao-needs
    depends_on:
      core-db: { condition: service_healthy }
      cerbos: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/core/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${CPU_CORE:-0.75}"
          memory: "${MEM_CORE:-512M}"

  ops-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OPS_DB_NAME:-ops}
      POSTGRES_USER: ${OPS_DB_USER:-ops}
      POSTGRES_PASSWORD: ${OPS_DB_PASSWORD:-ops}
    volumes: [ops-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPS_DB_USER:-ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${CPU_OPS_DB:-0.40}"
          memory: "${MEM_OPS_DB:-256M}"

  operations:
    build: ./cfao-operations
    restart: unless-stopped
    env_file: [.env]
    environment:
      OPS_DB_HOST: ops-db
      CERBOS_HTTP: http://cerbos:3592
      OIDC_JWKS_URL: http://keycloak:8080/realms/${OIDC_REALM:-cfao}/protocol/openid-connect/certs
      OIDC_ISSUER: http://keycloak:8080/realms/${OIDC_REALM:-cfao}
    depends_on:
      ops-db: { condition: service_healthy }
      cerbos: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/ops/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${CPU_OPS:-0.50}"
          memory: "${MEM_OPS:-256M}"

  # Story 04-5 : service des comptes rendus formateur (cfao-comptes-rendus/),
  # en mode integre : jeton Keycloak verifie, decisions de son propre Cerbos,
  # base SQLite et photos sur son volume. Joignable par la passerelle seule.
  # Mode integre : API seule pour l'instant, l'interface (cfao-comptes-rendus/web)
  # n'est ni construite ni servie ici (differe, voir MODULE_RAPPORTS_FORMATEUR.md §9).
  # Voir docs/MODULE_RAPPORTS_FORMATEUR.md.
  rapports-cerbos:
    image: ghcr.io/cerbos/cerbos:0.40.0
    restart: unless-stopped
    command: ["server", "--config=/config/config.yaml"]
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - ./cfao-comptes-rendus/cerbos/policies:/policies:ro
      - ./cfao-comptes-rendus/cerbos/config.yaml:/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${CPU_RAPPORTS_CERBOS:-0.25}"
          memory: "${MEM_RAPPORTS_CERBOS:-128M}"

  rapports:
    build: ./cfao-comptes-rendus/api
    restart: unless-stopped
    environment:
      DEPLOYMENT_MODE: integrated
      SECRET_KEY: ${RAPPORTS_SECRET_KEY:?RAPPORTS_SECRET_KEY est obligatoire}
      # La passerelle transmet le nom public (Host) ; localhost pour la sonde.
      ALLOWED_HOSTS: ${RAPPORTS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Pages autorisees a ecrire (controle d'Origin) : la passerelle de la plateforme.
      ORIGINES_AUTORISEES: ${RAPPORTS_ORIGINES_AUTORISEES:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: sqlite:////donnees/comptes-rendus.sqlite3
      CERBOS_HTTP: http://rapports-cerbos:3592
      PLATFORM_CORE_URL: http://core:8000
      OIDC_JWKS_URL: http://keycloak:8080/realms/${OIDC_REALM:-cfao}/protocol/openid-connect/certs
      OIDC_ISSUER: http://keycloak:8080/realms/${OIDC_REALM:-cfao}
      # Toujours verifiee par ce service : client Keycloak du portail par defaut.
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-cfao-portal}
    # Meme volume que l'ancien service : ses photos restent en place
    # (reprise des brouillons : `make rapports-importer`).
    volumes: [rapports-donnees:/donnees]
    depends_on:
      rapports-cerbos: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5175/apercu/sante"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          # LibreOffice convertit une page a la fois, mais un rapport complet
          # monte a plusieurs centaines de Mo.
          cpus: "${CPU_RAPPORTS:-1.0}"
          memory: "${MEM_RAPPORTS:-1G}"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8000:80"]
    volumes: [./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      core: { condition: service_healthy }
      operations: { condition: service_healthy }
      rapports: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "${CPU_GATEWAY:-0.25}"
          memory: "${MEM_GATEWAY:-64M}"

  # Base de données MongoDB MEDACAP (Persistante & strictement bornée en mémoire)
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: academy
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${CPU_MONGO:-0.50}"
          memory: "${MEM_MONGO:-512M}"
        reservations:
          memory: "${MEM_MONGO_RES:-256M}"

  # BFF : flow OIDC + cookie de session httpOnly. À activer une fois le client
  # Keycloak provisionné (00-6). Laisse en commentaire tant que non câblé bout-en-bout.
  # oauth2-proxy:
  #   image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
  #   env_file: [.env]
  #   command: ["--config=/oauth2-proxy.cfg"]
  #   volumes: [./gateway/oauth2-proxy.cfg:/oauth2-proxy.cfg:ro]
  #   depends_on: [keycloak]

volumes:
  keycloak-db-data:
  core-db-data:
  ops-db-data:
  rapports-donnees:
  mongodb-data:

networks:
  # Réseau par défaut du projet cfaoacademy (implicite auparavant, explicité pour la clarté).
  default:
    name: cfaoacademy_default
  # Réseau externe géré par le projet cfao-needs (service détachable, docker-compose distinct).
  # cfao-core s'y attache pour lire `needs-db` (formations programmées cette année).
  # Créé automatiquement par `docker compose up` de cfao-needs — si absent, le boot de
  # cfao-core échoue avec un message explicite (démarrer cfao-needs d'abord).
  cfao-needs:
    external: true
    name: cfao-needs_default

